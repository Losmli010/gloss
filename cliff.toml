# git-cliff 配置
# 从 Conventional Commits 历史自动生成 CHANGELOG.md
# 用法：git cliff -o CHANGELOG.md   或   just changelog
# 详见：https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

本文件记录 Gloss 所有面向用户的显著变更，格式遵循 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.1.0/)，
版本号遵循 [语义化版本](https://semver.org/lang/zh-CN/)。

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
  - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "新增功能" },
  { message = "^fix", group = "问题修复" },
  { message = "^perf", group = "性能优化" },
  { message = "^refactor", group = "重构" },
  { message = "^chore", group = "工程维护" },
  { message = "^docs", group = "文档" },
  { message = "^style", group = "样式" },
  { message = "^test", group = "测试" },
]
protect_breaking_commits = false
filter_commits = false
sort_commits = "oldest"
