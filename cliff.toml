# 发版说明工具（git-cliff）配置：为托管平台（GitHub）发布页（Release）渲染发版说明，唯一来源、不落仓库文件；
# 持续集成在打标签后渲染当前标签的一节作发布正文。

[changelog]
header = """"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
  - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "新增功能" },
  { message = "^fix", group = "问题修复" },
  { message = "^perf", group = "性能优化" },
  { message = "^refactor", group = "重构" },
  { message = "^chore", group = "工程维护" },
  { message = "^docs", group = "文档" },
  { message = "^style", group = "样式" },
  { message = "^test", group = "测试" },
]
protect_breaking_commits = false
filter_commits = false
sort_commits = "oldest"
