[package]
name = "gloss-eval"
version.workspace = true
edition.workspace = true
description = "Prompt 评测：确定性重放 + LLM judge（评测资产与工具链，不进生产）"
license.workspace = true

# 唯一入口：评测命令行。
[[bin]]
name = "eval"
path = "src/main.rs"

[dependencies]
# 实跑轨（live）复用生产流式引擎（核心库客户端）；本包（crate）只许消费，不许被
# 生产包（crate）依赖——约束检查脚本的依赖方向断言强制。
gloss-core = { path = "../gloss-core" }
# 评测数据集与报告的序列化。
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# 实跑轨（live）的运行时：重放不触网，不用异步设施。
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
# 实跑轨（live）测试的脚本引擎要产出任务流（核心库的测试桩不出库）。
futures = { version = "0.3", default-features = false, features = ["std"] }

[lints]
workspace = true
