[package]
name = "gloss-platform"
version.workspace = true
edition.workspace = true
description = "Gloss 适配器层：实现 gloss-core 端口 + 平台事件源"
license.workspace = true

[dependencies]
# 剪贴板兜底读取（模拟复制）的原文保存与恢复。不用默认集：其系统（macOS）读图
# 只认图像格式（TIFF）且无尺寸设界，剪贴板图片取材不走本库。
arboard = { version = "3", default-features = false }
# 密钥项取引用再删除：安全框架的安全搜索封装交回的是包装类型，还原裸引用
# 要经本库的基础类型转换（版本须与安全框架所用一致）。
core-foundation = { version = "0.10", default-features = false }
# 平台事件线程的运行循环（RunLoop）宿主与定时器取空，及选区、剪贴板兜底的系统框架（CF）类型绑定。
core-foundation-sys = {
  version = "0.8",
  default-features = false,
  features = [
    "link",
  ]
}
# 事件线程消费通道 2、转发 1、4。
crossbeam-channel = { version = "0.5", default-features = false, features = ["std"] }
# 配置存储的目录定位（日志目录例外，不走本库）。
directories = { version = "6", default-features = false }
gloss-core = { path = "../gloss-core" }
# 剪贴板图片取材：图像格式（TIFF/PNG）数据解码（仅读头取尺寸设界），像素格式（RGBA）重编码为
# 位图（PNG），快速压缩档在事件线程上执行。
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
# 程序坞（Dock）图标：非打包运行时装上品牌图标，打包运行走图标包（同设计，视觉无差）。
objc2 = {
  version = "0.6.4",
  default-features = false,
  features = [
    "std",
  ]
}
objc2-app-kit = {
  version = "0.3.2",
  default-features = false,
  features = [
    "NSApplication",
    "NSEvent",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSWorkspace",
    # 进程标识与自身判定被系统库（libc）特性门控。
    "libc",
  ]
}
objc2-foundation = {
  version = "0.3.2",
  default-features = false,
  features = [
    "NSArray",
    "NSData",
    "NSLocale",
    "NSString",
    # 应用包地址的返回类型：无障碍通道激活按包路径查内核框架形态。
    "NSURL",
  ]
}
# 密钥存储的系统安全框架绑定（通用密码读写），无版本门控特性需求。
security-framework = { version = "3", default-features = false }
# 密钥的引用式删除：上层未封装删引用一条路，取系统层的删除函数与
# 条目未找到常量。
security-framework-sys = { version = "2", default-features = false }
# 配置文档的配置格式（TOML）序列化，读解析加写格式化。
toml = {
  version = "0.8",
  default-features = false,
  features = [
    "display",
    "parse",
  ]
}

[dev-dependencies]
# 存储单测的临时目录。
tempfile = { version = "3", default-features = false }

[lints]
workspace = true
