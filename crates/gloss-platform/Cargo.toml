[package]
name = "gloss-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gloss 适配器层：实现 gloss-core 端口 + 平台事件源"

[dependencies]
# 事件线程消费通道②、转发①④，与 gloss-app::channel 的选型一致用 crossbeam。
# std 是默认集的全部内容，显式写出以维持「关默认集、按需开特性」的统一写法。
crossbeam-channel = { version = "0.5", default-features = false, features = ["std"] }
# 全局热键事件源。不用默认特性：默认集只多出可选的 serde 支持，注册/监听用不到。
global-hotkey = { version = "0.6", default-features = false }
gloss-core = { path = "../gloss-core" }

# 平台事件线程的 RunLoop 宿主（CFRunLoopRun / 定时器 drain）。-sys crate 没有
# 可裁剪的依赖子树，唯一职责是绑定目标平台的 C API，保持默认特性。
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
