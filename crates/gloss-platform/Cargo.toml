[package]
name = "gloss-platform"
version.workspace = true
edition.workspace = true
description = "Gloss 适配器层：实现 gloss-core 端口 + 平台事件源"
license.workspace = true

[dependencies]
# 剪贴板兜底读取（模拟复制）的原文保存与恢复。不用默认集：其系统（macOS）读图
# 只认图像格式（TIFF）且无尺寸设界，剪贴板图片取材不走本库。
arboard = { version = "3", default-features = false }
# 事件线程消费通道 2、转发 1、4。
crossbeam-channel = { version = "0.5", default-features = false, features = ["std"] }
gloss-core = { path = "../gloss-core" }
# 剪贴板图片取材的解码与重编码依赖按目标声明（消费面只在各平台的剪贴板
# 模块）：像素格式（RGBA）重编码为位图（PNG），快速压缩档在事件线程上执行，
# 仅读头取尺寸设界。解码特性面按目标拆分：便携式网络图形（PNG）两端都有；
# 标记图像格式（TIFF）仅系统（macOS）节；位图家族（位图（BMP）解码器及其
# 无文件头入口，即设备无关位图（DIB/CF_DIB/CF_DIBV5）的承载）仅系统
# （Windows）节。

[dev-dependencies]
# 共享图片归一化测试的像素面积闸门夹具：补丁便携式网络图形（PNG）头块尺寸后
# 重算头块循环冗余校验（关键块校验失败即拒头，闸门测试要求头可读）。
crc32fast = { version = "1", default-features = false }
# 日志捕获夹具（核心库的测试支撑特性）：只在测试目标里启用，不进正常构建。
gloss-core = { path = "../gloss-core", features = ["test-support"] }
# 存储单测的临时目录。
tempfile = { version = "3", default-features = false }

# 系统（macOS）专属依赖按目标门控：仅平台目录下的系统模块引用，其余目标不编译。
[target.'cfg(target_os = "macos")'.dependencies]
# 密钥项取引用再删除：安全框架的安全搜索封装交回的是包装类型，还原裸引用
# 要经本库的基础类型转换（版本须与安全框架所用一致）。
core-foundation = { version = "0.10", default-features = false }
# 平台事件线程的运行循环（RunLoop）宿主与定时器取空，及选区、剪贴板兜底的系统框架（CF）类型绑定。
core-foundation-sys = {
  version = "0.8",
  default-features = false,
  features = [
    "link",
  ]
}
# 配置存储的目录定位（日志目录例外，不走本库）。
directories = { version = "6", default-features = false }
# 剪贴板图片取材：标记图像格式（TIFF）与便携式网络图形（PNG）数据解码。
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
# 程序坞（Dock）图标：非打包运行时装上品牌图标，打包运行走图标包（同设计，视觉无差）。
objc2 = {
  version = "0.6.4",
  default-features = false,
  features = [
    "std",
  ]
}
objc2-app-kit = {
  version = "0.3.2",
  default-features = false,
  features = [
    "NSApplication",
    "NSEvent",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSWorkspace",
    # 进程标识与自身判定被系统库（libc）特性门控。
    "libc",
  ]
}
objc2-foundation = {
  version = "0.3.2",
  default-features = false,
  features = [
    "NSArray",
    "NSData",
    "NSLocale",
    "NSString",
    # 应用包地址的返回类型：无障碍通道激活按包路径查内核框架形态。
    "NSURL",
  ]
}
# 密钥存储的系统安全框架绑定（通用密码读写），无版本门控特性需求。
security-framework = { version = "3", default-features = false }
# 密钥的引用式删除：上层未封装删引用一条路，取系统层的删除函数与
# 条目未找到常量。
security-framework-sys = { version = "2", default-features = false }
# 配置文档的配置格式（TOML）序列化，读解析加写格式化。
toml = {
  version = "0.8",
  default-features = false,
  features = [
    "display",
    "parse",
  ]
}

# 系统（Windows）专属依赖按目标门控：仅平台目录下的系统模块引用，其余目标
# 不编译。特性面按用到的接口域显式列出，不开任何接口域之外的整域。
[target.'cfg(target_os = "windows")'.dependencies]
# 配置存储的目录定位（日志目录例外，不走本库）：文档半边与系统（macOS）同源。
directories = { version = "6", default-features = false }
# 剪贴板图片取材：位图家族（位图（BMP）解码器及其无文件头入口，即设备无关
# 位图（DIB/CF_DIB/CF_DIBV5）的承载）与便携式网络图形（PNG）数据解码。
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
# 配置文档的配置格式（TOML）序列化，读解析加写格式化。
toml = {
  version = "0.8",
  default-features = false,
  features = [
    "display",
    "parse",
  ]
}
# 托盘图标与托盘菜单（行为差异项：托盘替代坞菜单）。默认特性是系统
# （Linux）后端（AppIndicator），系统（Windows）编译面用不到，按目标
# 特性面收敛。
tray-icon = { version = "0.26", default-features = false }
windows = {
  version = "0.62",
  default-features = false,
  features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
  ]
}

[lints]
workspace = true
