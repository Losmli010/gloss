[package]
name = "gloss-platform"
version.workspace = true
edition.workspace = true
description = "Gloss 适配器层：实现 gloss-core 端口 + 平台事件源"
license.workspace = true

[dependencies]
# 剪贴板兜底读取（模拟复制）的原文保存/恢复 + 剪贴板图片取材的 RGBA 读出
# （image-data：macOS 上经内部 NSBitmapImageRep 解码 TIFF/PNG flavor）。
# 不用默认集的其余特性（wayland 后端变体等）。
arboard = { version = "3", default-features = false, features = ["image-data"] }
# 平台事件线程的 RunLoop 宿主（CFRunLoopRun / 定时器 drain）与选区、剪贴板
# 兜底的 CF 类型绑定。
core-foundation-sys = {
  version = "0.8",
  default-features = false,
  features = [
    "link",
  ]
}
# 事件线程消费通道②、转发①④。
crossbeam-channel = { version = "0.5", default-features = false, features = ["std"] }
# FileConfigStore 的配置目录定位（日志目录例外，不走 directories）。
directories = { version = "6", default-features = false }
gloss-core = { path = "../gloss-core" }
# 剪贴板图片取材的 RGBA → PNG 编码（快速压缩档，事件线程上执行）。与
# arboard image-data 在 macOS 上引入的同一版本族（0.25）共享一棵依赖树。
image = { version = "0.25", default-features = false, features = ["png"] }
# Dock 图标：非 bundle 运行（just run）时经 `NSApplication.setApplicationIconImage`
# 装上品牌图标，bundle 运行走 .icns（同设计，视觉无差）。
objc2 = {
  version = "0.6.4",
  default-features = false,
  features = [
    "std",
  ]
}
objc2-app-kit = {
  version = "0.3.2",
  default-features = false,
  features = [
    "NSApplication",
    "NSImage",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSWorkspace",
    # NSRunningApplication 的 processIdentifier（is_self 判定）被 libc 特性门控。
    "libc",
  ]
}
objc2-foundation = {
  version = "0.3.2",
  default-features = false,
  features = [
    "NSArray",
    "NSData",
    "NSLocale",
    "NSString",
  ]
}
# 兜底复制的按键注入与真机测试的事件注入（rdev::simulate）；默认集只多出
# 可选的 serde 支持，注入用不到。手势监听不走 rdev（见 events/mouse.rs 模块注释）。
rdev = { version = "0.5", default-features = false }
# KeychainSecret 的 Security framework 绑定（通用密码读写）。无版本门控
# 特性需求。
security-framework = { version = "3", default-features = false }
# 配置文档的 TOML 序列化（parse 读 + display 写）。
toml = {
  version = "0.8",
  default-features = false,
  features = [
    "display",
    "parse",
  ]
}

[dev-dependencies]
# storage 单测的临时目录。
tempfile = { version = "3", default-features = false }

[lints]
workspace = true
