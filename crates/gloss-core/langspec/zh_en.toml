# 语言规范数据源：中西两场景的字符事实与判定开关。开发侧脚本与生产侧
# 判定器都从这里派生字符事实（scripts/hooks/language_spec/chinese.py），
# 任何一侧不得私改（事实单源）。分区：场景标点面、共用面、策略开关与文
# 字系统区段四块。字面内容与迁出前的常量表逐符号对版，等价搬迁由核心库
# 的锁定测试背书。分场原则：场景间事实有差异的成员不共用，拆入场景专属
# 面单独维护；真共用（记号中立、同形同位、码位同一）的维持共用，场景面
# 与共用面在两侧派生处按场景合成完整面。
# 区段类值用空格分隔的十六进制闭区间串（起、止），按码位升序书写。

[zh]
# 中文标点集：中文正文任意位置放行的标点。直角引号不入集（中文场景
# 全禁，容器语义走弯引号与直引号定界）。分隔号收全角斜线是显式取舍：
# 国标的中文分隔号事实是半角斜线，放开牵动中文区半角禁入整体口径与命
# 令段豁免，留单独决策。弯单引号入集同理是显式取舍：同一码位在英文场
# 景按（ASCII）纪律判罚，两场景角色相反，防未来误改。
punct = "，。、；：？！“”‘’《》（）·／"
# 数字附随面（中文场景专属成员），与共用附随面在派生处合成中文完整面：
# 摄氏华氏的中文主导写法是单码位兼容字符，英文排印事实永远写度符号加拉
# 丁字母（°C、°F），不用兼容码位；万分率是中文金融语境的真实用符（英
# 文罕用），补缺归本面；全角人民币符是（CJK）场景字形，英文场景事实用
# 半角元符。成员都按附随语义放行：紧贴数字按计量写法放行，其余位置按标
# 点判。
attached_after_digit = "℃℉‱"
attached_before_digit = "￥"

[en]
# 西文标点集：英文场景任意位置放行的标点。
punct = ",.:;!?\"'()-"

[shared]
# 中性面（数学与逻辑记号）：两场景任意放行（并入两侧允许表）。
math = "=+<>^±×÷≤≥≠≈→"

# 数字附随面：符号紧贴数字按计量写法放行，其余位置按标点判。
# 前邻数字放行（百分族与计量族——计量族归附随面，不再任意放行；只收
# 两场景同形同位的成员，场景差异成员住各场景专属面）。
attached_after_digit = "%‰°′″"
# 后邻数字放行（货币族，只收两场景同形同位的成员）。
attached_before_digit = "€£¥₩"
# 数字夹住放行（句点、逗号、短横与冒号）；时分与比分的冒号形态按数字用
# 法国标收半角，冒号后非数字的键值对与网址照拦。与西文标点集重叠是既定
# 形态（同符号按位置双角色），不属归位分歧。
attached_between_digits = ".,-:"
# 破折号省略号家族：两侧放行不判，机制是家族豁免。两点省略号不在族内：
# 中文省略号是双省略号，英文是单省略号或三点，两点形态是日文记号，
# 两场景都不用，整体移除判罚。
dash_ellipsis = "—–…"
# 引文容器的弯引号定界：定界符随容器豁免，不属正文标点。
curly_quotes = "“”"
# 句末标点面：括注成句判定（SentenceInParens）的收尾符集，中西各三符；
# 与两场景标点集按位置各司其职，不属归位四层。
sentence_finals = "。！？.!?"

# 表情事实：表情区段（空格分隔十六进制闭区间）、高频裸表情与变体选择
# 符（转义书写），三者之外的正文符号不在表情判罚面。
emoji_ranges = "1F000-1F02B 1F0A0-1F0FF 1F100-1F1FF 1F200-1F2FF 1F300-1F5FF 1F600-1F64F 1F680-1F6FF 1F900-1F9FF 1FA00-1FAFF"
emoji_bare = "✅✨❌❤⚡⭐"
emoji_variants = "\uFE0E\uFE0F"

[shared.brackets]
# 括号对（容器定界符）：开、闭各一符。
zh = ["（", "）"]
en = ["(", ")"]

[policy]
# 盘古之白与简繁判定的场景开关：中文开、英文关。
pangu = { zh = true, en = false }
simplified = { zh = true, en = false }

[ranges]
# 文字系统区段整表：汉字取扩展甲区、基本区、兼容区三段（现行口径）；
# 拉丁只收扩展区段，基础拉丁字母与残余归类是判定机制，仍住代码。
latin = "00C0-024F 1E00-1EFF 2C60-2C7F A720-A7FF"
han = "3400-4DBF 4E00-9FFF F900-FAFF"
kana = "3041-30FF 31F0-31FF FF66-FF9D"
hangul = "1100-11FF 3130-318F AC00-D7A3"
cyrillic = "0400-052F"
greek = "0370-03FF 1F00-1FFF"
