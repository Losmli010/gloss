[package]
name = "gloss-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gloss 领域层与端口（纯逻辑，零平台/UI 依赖）"

[dependencies]
# 配置热更新的无锁快照（M4-T3）：ArcSwap<Config> 原子替换，读路径零锁。
# 无默认特性可关，照写以保持 AGENTS.md 约束「依赖只开需要的特性」的写法统一。
arc-swap = { version = "1", default-features = false }
# Cache 端口的内存 LRU+TTL 实现（sync API 即所需，future 异步面不用）。
moka = { version = "0.12", default-features = false, features = ["sync"] }
# TaskStream 的 Stream trait（no-std 最小集）；StreamExt 等工具留给使用方自选。
futures-core = { version = "0.3", default-features = false }
# cache_key 的规范化序列化（同文本不同 kind 必须得到不同 key）。
serde_json = { version = "1", default-features = false, features = ["std"] }
# 任务模型的序列化（配置落盘 / 缓存 key / 未来跨进程）；rc 供 TaskInput 的
# Arc<[u8]> 图像字节按内部值序列化（反序列化会新分配，所有权语义不变）。
serde = { version = "1", default-features = false, features = ["std", "derive", "rc"] }
# mock 引擎的流间延迟（M3-T7），仅 test-util 特性按需启用。
tokio = { version = "1", default-features = false, features = ["time"], optional = true }
# 日志三件套（统一出口的实现）。默认集先关再显式列全：
# - tracing 留 std（关掉会退化成 no-op），不留 attributes——项目不用 #[instrument]
#   （过程宏无法跨 crate 转发，见 log.rs 模块文档），顺带省掉 tracing-attributes 一支；
# - tracing-appender 无特性可关，照写以保持「关默认集」写法统一；
# - tracing-subscriber 列全 fmt::layer 所需的 ansi/fmt/std/smallvec，env-filter 供
#   RUST_LOG 过滤，tracing-log 必须留：GUI 栈（egui / wgpu / naga / font-kit）都经
#   log 门面记录，去掉它这些三方诊断就不再进终端与日志文件。
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-appender = { version = "0.2.5", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "ansi",
    "env-filter",
    "fmt",
    "smallvec",
    "std",
    "tracing-log",
] }

[features]
# 测试辅助：mock 引擎等单测基建，随下游 dev-dependencies 按需开启。
test-util = ["dep:tokio"]

[dev-dependencies]
# 端口单测：流式消费用 StreamExt，异步测试跑 #[tokio::test]。
futures = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }

[lints]
workspace = true
