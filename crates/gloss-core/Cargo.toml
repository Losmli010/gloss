[package]
name = "gloss-core"
version.workspace = true
edition.workspace = true
description = "Gloss 领域层、端口与任务 AI 层（含内建 LLM 流式传输；零渲染/窗口依赖）"
license.workspace = true

[dependencies]
# 配置热更新的无锁快照：ArcSwap<Config> 原子替换，读路径零锁。
arc-swap = { version = "1", default-features = false }
# 请求体组装的图像部件编码（engine::llm）：PNG 字节 → data URL 的 base64
# 载荷；域类型只携带原始字节，编码只发生在请求体构造处。
base64 = { version = "0.22", default-features = false, features = ["std"] }
# SSE 流的分块字节（reqwest 的 bytes_stream 逐块交出 Bytes）。
bytes = { version = "1", default-features = false }
# TaskStream 的 Stream trait（no-std 最小集）；StreamExt 等工具留给使用方自选。
futures-core = { version = "0.3", default-features = false }
# 内建引擎传输（engine::llm）：OpenAI 兼容端点的流式调用。最小特性集：
# SSE 用 HTTP/1.1 足够，TLS 走 rustls + 系统根证书。
reqwest = {
  version = "0.12",
  default-features = false,
  features = [
    "json",
    "rustls-tls-native-roots",
    "stream",
  ]
}
# 任务模型的序列化（配置落盘 / 未来跨进程）；rc 供 TaskInput 的
# Arc<[u8]> 图像字节按内部值序列化（反序列化会新分配，所有权语义不变）。
serde = { version = "1", default-features = false, features = ["derive", "rc", "std"] }
# 任务/分类输出契约的 JSON 解析（评测与编排测试用）。
serde_json = { version = "1", default-features = false, features = ["std"] }
# 日志三件套（统一出口的实现）。默认集先关再显式列全：tracing 留 std，
# subscriber 列全 fmt::layer 所需特性，env-filter 供 RUST_LOG 过滤。
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-appender = { version = "0.2.5", default-features = false }
tracing-subscriber = {
  version = "0.3.23",
  default-features = false,
  features = [
    "ansi",
    "env-filter",
    "fmt",
    "json",
    "smallvec",
    "std",
    "tracing-log",
  ]
}

[dev-dependencies]
# 端口单测：流式消费用 StreamExt，异步测试跑 #[tokio::test]。
futures = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }

[lints]
workspace = true
