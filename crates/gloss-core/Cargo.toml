[package]
name = "gloss-core"
version.workspace = true
edition.workspace = true
description = "Gloss 领域层、端口与任务 AI 层（含内建 LLM 流式传输；零渲染/窗口依赖）"
license.workspace = true

[dependencies]
# 配置热更新的无锁快照：配置对象原子替换，读路径零锁。
arc-swap = { version = "1", default-features = false }
# 请求体组装的图像部件编码（内建引擎）：位图（PNG）字节经编码（base64）为载荷；
# 域类型只携带原始字节，编码只发生在请求体构造处。
base64 = { version = "0.23", default-features = false, features = ["std"] }
# 流式事件（SSE）流的分块字节，传输协议（HTTP）客户端逐块交出字节块。
bytes = { version = "1", default-features = false }
# 任务流的流式最小集；流工具留给使用方自选。
futures-core = { version = "0.3", default-features = false }
# 输出语言体例门禁的结构节点判定：纯解析形态，关闭默认特性。
pulldown-cmark = { version = "0.13", default-features = false }
# 内建引擎传输：兼容端点（OpenAI）的流式调用。最小特性集：
# 流式事件（SSE）用传输协议（HTTP）第一版足够，传输安全（TLS）走安全传输库（rustls）加系统根证书。
reqwest = {
  version = "0.12",
  default-features = false,
  features = [
    "json",
    "rustls-tls-native-roots",
    "stream",
  ]
}
# 任务模型的序列化（配置落盘、未来跨进程）；引用计数特性供图像字节按内部
# 值序列化（反序列化会新分配，所有权语义不变）。
serde = { version = "1", default-features = false, features = ["derive", "rc", "std"] }
# 任务与分类输出契约的数据格式（JSON）解析（评测与编排测试用）。
serde_json = { version = "1", default-features = false, features = ["std"] }
# 流式空闲看门狗与传输重试退避（内建引擎）：定时等待只要时间特性。
tokio = { version = "1", default-features = false, features = ["time"] }
# 日志三件套（统一出口的实现）。默认集先关再显式列全：核心留标准特性，
# 订阅层列全格式化所需特性，环境过滤供日志等级过滤。
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-appender = { version = "0.2.5", default-features = false }
tracing-subscriber = {
  version = "0.3.23",
  default-features = false,
  features = [
    "ansi",
    "env-filter",
    "fmt",
    "json",
    "smallvec",
    "std",
    "tracing-log",
  ]
}

[dev-dependencies]
# 端口单测：流式消费用流工具，异步测试跑异步测试宏；测试工具特性供
# 虚拟时钟（空闲超时、重试退避的确定性测试）。
futures = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "test-util", "time"] }

[lints]
workspace = true
