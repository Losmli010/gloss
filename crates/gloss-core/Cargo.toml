[package]
name = "gloss-core"
version.workspace = true
edition.workspace = true
description = "Gloss 领域层与端口（纯逻辑，零平台/UI 依赖）"
license.workspace = true

[dependencies]
# 配置热更新的无锁快照：ArcSwap<Config> 原子替换，读路径零锁。
arc-swap = { version = "1", default-features = false }
# TaskStream 的 Stream trait（no-std 最小集）；StreamExt 等工具留给使用方自选。
futures-core = { version = "0.3", default-features = false }
# Cache 端口的内存 LRU+TTL 实现（sync API 即所需，future 异步面不用）。
moka = { version = "0.12", default-features = false, features = ["sync"] }
# 任务模型的序列化（配置落盘 / 缓存 key / 未来跨进程）；rc 供 TaskInput 的
# Arc<[u8]> 图像字节按内部值序列化（反序列化会新分配，所有权语义不变）。
serde = { version = "1", default-features = false, features = ["derive", "rc", "std"] }
# cache_key 的规范化序列化（同文本不同 kind 必须得到不同 key）。
serde_json = { version = "1", default-features = false, features = ["std"] }
# 日志三件套（统一出口的实现）。默认集先关再显式列全：tracing 留 std，
# subscriber 列全 fmt::layer 所需特性，env-filter 供 RUST_LOG 过滤。
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-appender = { version = "0.2.5", default-features = false }
tracing-subscriber = {
  version = "0.3.23",
  default-features = false,
  features = [
    "ansi",
    "env-filter",
    "fmt",
    "smallvec",
    "std",
    "tracing-log",
  ]
}

[dev-dependencies]
# 端口单测：流式消费用 StreamExt，异步测试跑 #[tokio::test]。
futures = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }

[lints]
workspace = true
