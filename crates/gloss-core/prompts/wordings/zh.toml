[classify.section]
header = "类别"
separator = "："

[classify.category.TranslateWord]
definition = "翻译单个词汇项，或以词汇项为主的列表。词汇项包括字、词、固定搭配、习语、谚语、专名、术语。习语、谚语、固定表达即使含主谓结构，也按词汇项整体处理，本专门规则优先于“可独立成句”的一般判断。"

[classify.category.TranslateSentence]
definition = "翻译语义完整的句子或成段文本。句子以“可独立成句”为准，不要求显式主语，省略句、祈使句等均算；段落按整体语义完整性判断。"

[classify.category.ExplainCode]
definition = "理解、解释、分析、调试代码。须满足：输入含代码，或含代码运行产物（如报错、日志、堆栈）。"

[classify.category.Fallback]
definition = "无翻译、代码解释等明确任务意图的输入，如闲聊、写作、总结、通识问答等。"

[target_lang]
zh = "中文"
en = "英语"
