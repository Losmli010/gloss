[package]
name = "gloss-app"
version.workspace = true
edition.workspace = true
description = "Gloss 表现层与应用层：状态机 + 渲染胶水"
license.workspace = true

[dependencies]
# 通道①②④用 crossbeam（MPMC，主线程 try_recv 非阻塞）。
crossbeam-channel = { version = "0.5", default-features = false, features = ["std"] }
# 渲染栈整批版本：winit 0.30.13 / wgpu 30.0.1 / egui + egui-wgpu + egui-winit
# 0.36.2 / pollster 1.0.1；全部 default-features = false + 显式列出所需特性。
egui = {
  version = "0.36.2",
  default-features = false,
  features = [
    "default_fonts",
  ]
}
# 结果卡 markdown 正文渲染：pulldown-cmark 解析后端；不开
# load-images/fetch/svg 取图路径。
egui_commonmark = {
  version = "0.25",
  default-features = false,
  features = [
    "pulldown_cmark",
  ]
}
# 保留 macos-window-resize-jitter-fix：真实的窗口缩放抖动修复。
egui-wgpu = {
  version = "0.36.2",
  default-features = false,
  features = [
    "macos-window-resize-jitter-fix",
  ]
}
egui-winit = {
  version = "0.36.2",
  default-features = false,
  features = [
    "clipboard",
    "links",
  ]
}
# 系统字体发现：查系统 CJK 字体接进 egui 后备链。
font-kit = { version = "0.14", default-features = false, features = ["source"] }
# FutureExt::catch_unwind 包住 tokio 消费循环里的任务 future（后台
# panic 被 tokio 捕获转为 TaskFailed」）。
futures = { version = "0.3", default-features = false, features = ["std"] }
gloss-core = { path = "../gloss-core" }
gloss-platform = { path = "../gloss-platform" }
# 同步等待 GPU 初始化。
pollster = { version = "1.0.1", default-features = false }
# 界面文案表的强类型反序列化：键缺失或多键都算解析失败。
serde = { version = "1", default-features = false, features = ["derive", "std"] }
# 通道③用 tokio mpsc；pipeline 的消费运行时与 select! 宏。
tokio = {
  version = "1",
  default-features = false,
  features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
  ]
}
# RunTask 携带的 CancellationToken。
tokio-util = { version = "0.7", default-features = false }
# 界面文案文件（i18n/*.toml）的解析；版本与 platform 保持一致。
toml = {
  version = "0.8",
  default-features = false,
  features = [
    "parse",
  ]
}
# 只留实际使用的 Metal 后端，配合 egui-wgpu 已声明的 std + wgsl。
wgpu = {
  version = "30.0.1",
  default-features = false,
  features = [
    "metal",
    "std",
    "wgsl",
  ]
}
# egui-winit 以 default-features = false 依赖 winit，特性开关由这里决定；
# rwh_06 是 egui-wgpu 拿原生窗口句柄所需。
winit = {
  version = "0.30.13",
  default-features = false,
  features = [
    "rwh_06",
  ]
}

[dev-dependencies]
# L2 浮层 harness 测试：AccessKit 树查询/点击 + wgpu 渲染快照（snapshot）。
egui_kittest = {
  version = "0.36",
  default-features = false,
  features = [
    "snapshot",
    "wgpu",
  ]
}
# 管道测试需要异步运行时宏与时间（mock 引擎的延迟注入用）。
tokio = {
  version = "1",
  default-features = false,
  features = [
    "macros",
    "rt",
    "time",
  ]
}

[lints]
workspace = true
