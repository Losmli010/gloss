[package]
name = "gloss-app"
description = "划词翻译工具 - 纯 Rust + egui + WebGPU"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gloss"
path = "src/main.rs"

[dependencies]
gloss-core = { path = "../gloss-core" }
gloss-platform = { path = "../gloss-platform" }

# 用法：cargo bundle --release --format osx（.app/.dmg）/ deb（.deb），在本 crate 目录执行
[package.metadata.bundle]
name = "Gloss"
identifier = "io.github.losmli010.gloss"
icon = []
category = "Utility"
short_description = "划词翻译工具"
long_description = "鼠标选中文字，即弹出 LLM 翻译结果。纯 Rust + egui + WebGPU 实现。"
