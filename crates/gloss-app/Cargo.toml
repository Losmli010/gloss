[package]
name = "gloss-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gloss 表现层与应用层：状态机 + 渲染胶水"

[dependencies]
# 渲染栈整批版本（egui 三件套必须同小版本；wgpu 版本由 egui-wgpu 决定，不要单独升级）：
# winit 0.30.13 / wgpu 30.0.1 / egui + egui-wgpu + egui-winit 0.36.2 / pollster 1.0.1
egui = "0.36.2"
egui-wgpu = "0.36.2"
# 不用默认特性：egui-winit 的 default 里含 "winit/default"，而 winit 默认集包含
# wayland-csd-adwaita → sctk-adwaita → ab_glyph → ttf-parser（已停止维护，
# RUSTSEC-2026-0192，无可用修复版本）。下面把我们要的特性显式列全，只少 CSD 一项。
# CSD 只影响 Linux 下 Wayland 的客户端窗口装饰，而 Gloss 的目标平台是 macOS / Windows
# （Linux 仅用于 CI），不引入。
egui-winit = { version = "0.36.2", default-features = false, features = [
    "clipboard",
    "links",
    "x11",
    "wayland",
] }
gloss-core = { path = "../gloss-core" }
gloss-platform = { path = "../gloss-platform" }
pollster = "1.0.1"
wgpu = "30.0.1"
# 不用默认特性：默认集里的 wayland-csd-adwaita 会把已停止维护的 ttf-parser 拖进
# 依赖树（同上）。egui-winit 是以 default-features = false 依赖 winit 的，
# 特性开关由这里决定，故把 Linux 需要的后端显式列全。
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
] }
