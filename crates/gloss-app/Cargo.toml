[package]
name = "gloss-app"
version.workspace = true
edition.workspace = true
description = "Gloss 表现层与应用层：状态机 + 渲染胶水"
license.workspace = true

[dependencies]
# 系统字体发现：已安装字体集合查询（CFDictionary/CFArray/CFString）+
# CoreText 选面；文件字节直接 fs::read 一次进 egui，面序号由文件自身
# 解析回答。core-foundation 留 link 特性（链接 CoreFoundation 框架）。
core-foundation = {
  version = "0.10",
  default-features = false,
  features = [
    "link",
  ]
}
core-text = { version = "22.0", default-features = false }
# 通道①②④用 crossbeam（MPMC，主线程 try_recv 非阻塞）。
crossbeam-channel = { version = "0.5", default-features = false, features = ["std"] }
# 渲染栈整批版本：winit 0.30.13 / wgpu 30.0.1 / egui + egui-wgpu + egui-winit
# 0.36.2 / pollster 1.0.1；全部 default-features = false + 显式列出所需特性。
egui = {
  version = "0.36.2",
  default-features = false,
  features = [
    "default_fonts",
  ]
}
# 结果卡 markdown 正文渲染：pulldown-cmark 解析后端；不开
# load-images/fetch/svg 取图路径。
egui_commonmark = {
  version = "0.25",
  default-features = false,
  features = [
    "pulldown_cmark",
  ]
}
# 代码面板的语法着色：syntect 分词（Sublime 语法集）由 egui_extras 转成
# LayoutJob；关默认特性只取 syntect，不引图片加载器。
egui_extras = {
  version = "0.36.2",
  default-features = false,
  features = [
    "syntect",
  ]
}
# 保留 macos-window-resize-jitter-fix：真实的窗口缩放抖动修复。
egui-wgpu = {
  version = "0.36.2",
  default-features = false,
  features = [
    "macos-window-resize-jitter-fix",
  ]
}
egui-winit = {
  version = "0.36.2",
  default-features = false,
  features = [
    "clipboard",
    "links",
  ]
}
# FutureExt::catch_unwind 包住 tokio 消费循环里的任务 future（unwind 构建
# 下后台 panic 转 TaskFailed；release panic=abort 下屏障不介入）——std 特性
# 只为它开；StreamExt::next（更新子系统的流式读取）无特性门。
futures = { version = "0.3", default-features = false, features = ["std"] }
gloss-core = { path = "../gloss-core" }
gloss-platform = { path = "../gloss-platform" }
# 页头应用图标的 PNG 解码（assets/icons/gloss-dock-icon.png 同源资产）。
image = { version = "0.25", default-features = false, features = ["png"] }
# 系统字体文件的只读内存映射（egui 借用登记的字节背衬）。
memmap2 = { version = "0.9", default-features = false }
# 任务产物缓存（sync API 即所需，future 异步面不用）。
moka = { version = "0.12", default-features = false, features = ["sync"] }
# 同步等待 GPU 初始化。
pollster = { version = "1.0.1", default-features = false }
# 通用兜底着色（syntect 无语法名时的字符串/注释/数字/类型/函数形）；
# unicode 供 \b/\w 按码点判定，perf 开字面量预前缀优化。
regex = { version = "1", default-features = false, features = ["perf", "std", "unicode"] }
# OpenAI 兼容端点的流式调用（platform 同款最小特性集）；更新子系统复用
# 同一套 TLS 与流式配置，清单与整包都走 rustls + 系统根证书。
reqwest = {
  version = "0.12",
  default-features = false,
  features = [
    "rustls-tls-native-roots",
    "stream",
  ]
}
# 更新清单的版本比较（semver 全序，构建元数据不参与优先级）。
semver = { version = "1", default-features = false, features = ["std"] }
# 界面文案表的强类型反序列化：键缺失或多键都算解析失败。
serde = { version = "1", default-features = false, features = ["derive", "std"] }
# 更新清单（manifest.json）的 JSON 反序列化：未知字段必须忽略（前向兼容），
# 不开 deny_unknown_fields 之类的严格面。
serde_json = { version = "1", default-features = false, features = ["std"] }
# 下载体的 sha256 校验（成熟库，不手搓）。
sha2 = { version = "0.10", default-features = false, features = ["std"] }
# 代码面板的语法分词（Sublime 语法集）；default-fancy 走 fancy-regex，
# 不引 onig 的 C 依赖。
syntect = {
  version = "5.3",
  default-features = false,
  features = [
    "default-fancy",
  ]
}
# 通道③用 tokio mpsc；pipeline 的消费运行时与 select! 宏。
tokio = {
  version = "1",
  default-features = false,
  features = [
    "fs",
    "io-util",
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
  ]
}
# RunTask 携带的 CancellationToken。
tokio-util = { version = "0.7", default-features = false }
# 界面文案文件（i18n/*.toml）的解析；版本与 platform 保持一致。
toml = {
  version = "0.8",
  default-features = false,
  features = [
    "parse",
  ]
}
# 额外语法集（bat 的语法补集）：补 syntect 默认集缺的 Kotlin/Swift/Dart/
# Elixir/Julia/TOML/TypeScript 等；fancy 特性与 syntect 的纯 Rust 正则
# 后端对齐，不引 onig。
two-face = {
  version = "0.5",
  default-features = false,
  features = [
    "syntect-fancy",
  ]
}
# 只留实际使用的 Metal 后端，配合 egui-wgpu 已声明的 std + wgsl。
wgpu = {
  version = "30.0.1",
  default-features = false,
  features = [
    "metal",
    "std",
    "wgsl",
  ]
}
# egui-winit 以 default-features = false 依赖 winit，特性开关由这里决定；
# rwh_06 是 egui-wgpu 拿原生窗口句柄所需。
winit = {
  version = "0.30.13",
  default-features = false,
  features = [
    "rwh_06",
  ]
}

[dev-dependencies]
# L2 浮层 harness 测试：AccessKit 树查询/点击 + wgpu 渲染快照（snapshot）。
egui_kittest = {
  version = "0.36",
  default-features = false,
  features = [
    "snapshot",
    "wgpu",
  ]
}
# 管道测试需要异步运行时宏与时间（mock 引擎的延迟注入用）。
tokio = {
  version = "1",
  default-features = false,
  features = [
    "macros",
    "rt",
    "time",
  ]
}

[lints]
workspace = true
