[package]
name = "gloss-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gloss 表现层与应用层：状态机 + 渲染胶水"

[dependencies]
# 通道①②④用 crossbeam（MPMC，主线程 try_recv 非阻塞）。std 特性即默认集全部内容，
# 显式写出以维持「关默认集、按需开特性」的统一写法。
crossbeam-channel = { version = "0.5", default-features = false, features = ["std"] }
# FutureExt::catch_unwind 包住 tokio 消费循环里的任务 future（06 §7「后台
# panic 被 tokio 捕获转为 TaskFailed」）。std 是 catch_unwind 所需；core 已
# 依赖 futures，不引入新子树。
futures = { version = "0.3", default-features = false, features = ["std"] }
# 渲染栈整批版本（egui 三件套必须同小版本；wgpu 版本由 egui-wgpu 决定，不要单独升级）：
# winit 0.30.13 / wgpu 30.0.1 / egui + egui-wgpu + egui-winit 0.36.2 / pollster 1.0.1
#
# 全部 default-features = false + 显式列出所需特性：默认集往往带有目标平台用不到的
# 后端（vulkan / gles / webgpu / wasm 等），既增加依赖与编译时间，也可能拖进有问题的包
# （参见 winit 的 wayland-csd-adwaita → ttf-parser，RUSTSEC-2026-0192）。新增依赖沿用此写法。
# Gloss 目标平台：macOS（Metal）、Windows（DX12）；Linux 仅用于 CI。
egui = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
] }
# 不用默认特性：默认里的 "wgpu/default" 会打开 wgpu 全部后端（见下方 wgpu 声明），
# 另含 wasm 专用的 fragile-send-sync-non-atomic-wasm 与 wgpu/webgl。
# 保留 macos-window-resize-jitter-fix：macOS 是首要目标平台，且它是真实的窗口缩放抖动修复。
egui-wgpu = { version = "0.36.2", default-features = false, features = [
    "macos-window-resize-jitter-fix",
] }
# 不用默认特性：egui-winit 的 default 里含 "winit/default"，而 winit 默认集包含
# wayland-csd-adwaita → sctk-adwaita → ab_glyph → ttf-parser（已停止维护，
# RUSTSEC-2026-0192，无可用修复版本）。下面把我们要的特性显式列全，只少 CSD 一项。
# CSD 只影响 Linux 下 Wayland 的客户端窗口装饰，目标平台不涉及。
egui-winit = { version = "0.36.2", default-features = false, features = [
    "clipboard",
    "links",
    "x11",
    "wayland",
] }
gloss-core = { path = "../gloss-core" }
gloss-platform = { path = "../gloss-platform" }
# 同步等待 GPU 初始化。macro 特性（block_on!/join!）用不到；无默认特性可关，
# 照写以保持「关默认集」写法统一。
pollster = { version = "1.0.1", default-features = false }
# 通道③用 tokio mpsc；pipeline 的消费运行时与 select! 宏。不用默认特性：
# 默认集会拉起整个子树（io/_net 等用不到），按需最小化。
tokio = { version = "1", default-features = false, features = [
    "sync",
    "rt",
    "rt-multi-thread",
    "macros",
] }
# RunTask 携带的 CancellationToken。sync 模块不在特性门后，关默认集即可用，
# 避免 codec / io 等无关子特性。
tokio-util = { version = "0.7", default-features = false }
# 不用默认特性：默认集含 gles / vulkan / webgpu 三个用不到的后端与 parking_lot。
# 只留目标平台实际使用的 Metal（macOS）与 DX12（Windows），配合 egui-wgpu 已声明的 std + wgsl。
# Linux 因而不带任何后端——该平台只跑 CI 的 fmt / clippy / test，不创建窗口。
wgpu = { version = "30.0.1", default-features = false, features = [
    "std",
    "wgsl",
    "metal",
    "dx12",
] }
# 不用默认特性：默认集里的 wayland-csd-adwaita 会把已停止维护的 ttf-parser 拖进
# 依赖树（同上）。egui-winit 是以 default-features = false 依赖 winit 的，
# 特性开关由这里决定，故把 Linux 需要的后端显式列出。
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
] }

# 系统字体发现（M1-T5）：仅 macOS / Windows；Linux 只跑 CI，不需要。
# 不用默认特性：默认集含 fs 相关探索能力，查系统字体只用 source + 加载，按需最小化。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
font-kit = { version = "0.14", default-features = false, features = ["source"] }

# 快照对比（wgpu 渲染 + 基线图 diff）仅在 macos 门控启用。
[target.'cfg(target_os = "macos")'.dev-dependencies]
egui_kittest = { version = "0.36", default-features = false, features = [
    "snapshot",
    "wgpu",
] }

[dev-dependencies]
# 管道测试用 mock 引擎（延迟/失败注入）；测试还需要异步运行时宏与时间。
gloss-core = { path = "../gloss-core", features = ["test-util"] }
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt",
    "time",
] }
# L2 浮层 harness 测试：AccessKit 树查询/点击（默认软件渲染器全平台）。
# 基础依赖不带 wgpu/snapshot 特性——它们经下方 macos 门控段追加，避免
# Linux/Windows 的测试构建编入 vulkan/gles 后端（与主依赖的后端政策一致）。
egui_kittest = { version = "0.36", default-features = false }

[lints]
workspace = true
