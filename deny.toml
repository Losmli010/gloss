# 依赖安全与合规检查（本地 `just deny`、CI 的 security job、每日定时任务共用）
# 文档：https://embarkstudios.github.io/cargo-deny/checks/index.html

[advisories]
# RustSec 漏洞库；出现未豁免的漏洞即失败。
# 确需豁免时把 advisory id 登记到这里，并写清豁免理由与跟踪项。
ignore = []

[licenses]
# 只收宽松许可证，copyleft（GPL/AGPL/LGPL）一律不放行。
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
# 只信任 crates.io，杜绝来路不明的 registry / git 源。
unknown-registry = "deny"
unknown-git = "deny"
