# Gloss workspace 根（虚拟清单，不含 [package]）
# 架构见 docs/06-系统架构设计.md：3-crate 结构，依赖方向严格单向——
#   gloss-app → gloss-core + gloss-platform（组装点唯一）
#   gloss-platform → gloss-core（实现其端口）
#   gloss-core → 不依赖任何本仓库 crate（零平台/UI 依赖，可完整单测）
[workspace]
resolver = "2"
members = [
    "crates/gloss-core",
    "crates/gloss-platform",
    "crates/gloss-app",
]

# 共享包元数据：各 crate 用 xxx.workspace = true 继承，版本号单点维护
# （release.yml 的版本号一致性校验读取本文件的 version 字段）
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# profile 只在 workspace 根生效
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
