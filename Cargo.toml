[package]
name = "gloss"
version.workspace = true
edition.workspace = true
description = "划词翻译工具 - 纯 Rust + egui + WebGPU"
license.workspace = true

# cargo-bundle 打包配置（GUI 应用分发包）
# 用法：just package-macos（bundle 出 .app，ad-hoc 签名后由 scripts/release/bundle-dmg.sh 压 .dmg）
[package.metadata.bundle]
name = "Gloss"
identifier = "io.github.losmli010.gloss"
# 应用图标。产物进仓库，重建用 just icons
# （矢量源与生成脚本见 assets/icons/README.md 与 scripts/dev/build-app-icon.sh）。
icon = ["assets/icons/Gloss.icns"]
category = "Utility"
short_description = "划词翻译工具"
long_description = "鼠标选中文字，即弹出 LLM 翻译结果。纯 Rust + egui + WebGPU 实现。"

[workspace]
resolver = "3"
members = ["crates/gloss-app", "crates/gloss-core", "crates/gloss-eval", "crates/gloss-platform"]

# 版本与 edition 单点维护，各 crate 继承
[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

# 生产路径必须传播错误：unwrap/expect 仅在注释文档化不变量（panic 不可能）
# 时允许；panic!/unreachable!/todo!/unimplemented! 一律禁止。测试代码不受限
# （clippy.toml 的 allow-*-in-tests）。各 crate 以 [lints] workspace = true 继承。
[workspace.lints.clippy]
expect_used = "deny"
# must_use 返回值不得静默丢给 let _；确需丢弃的必须在 allow 旁注明缘由。
let_underscore_must_use = "deny"
# 长驻进程禁止 mem::forget 式泄漏。
mem_forget = "deny"
panic = "deny"
print_stderr = "deny"
# 日志唯一出口是 gloss_core::log；见 AGENTS.md 质量条目「日志统一出口」。
print_stdout = "deny"
todo = "deny"
# unsafe 块必须带 `// SAFETY:` 注释说明不变量；允许有 unsafe，但不允许无据的 unsafe。
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
missing_docs = "deny"

# 唯一入口：组装依赖、分发通道 Sender、启动线程与事件循环
[[bin]]
name = "gloss"
path = "src/main.rs"

[[test]]
harness = false
name = "overlay"

# L3 启动预算自检：渲染栈初始化墙钟对 STARTUP_BUDGET 判门禁
# 运行：just startup-selftest
[[test]]
harness = false
name = "startup"

# 热点基准（criterion，四组：cache_key / complete / prompt_render / task_cache）
# 运行：just bench
[[bench]]
harness = false
name = "core"

# clone 热点基准（criterion 自定义测量，两组：分配次数 / 分配字节）
# 运行：just clone-bench
[[bench]]
harness = false
name = "clone"

[dependencies]
gloss-app = { path = "crates/gloss-app" }
# 测试桩只在 tests/stubs/，经 cfg(test) 编译进测试目标，不进发布二进制。
gloss-core = { path = "crates/gloss-core" }
gloss-platform = { path = "crates/gloss-platform" }

# 公共 API 必须有文档注释，由 missing_docs = deny 强制；文档里的示例
# 由 cargo test --doc（just test 一部分）验证可编译可运行。
[dev-dependencies]
# 基准框架（benches/core）；特性只保留 cargo_bench_support。
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# clone 基准的无头帧驱动（benches/clone 用 run_ui）；版本与 gloss-app 同批。
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
# 自检 stderr 结构化信号行（overlay_perf 汇总行等）的 JSON 序列化。
serde_json = { version = "1", default-features = false, features = ["std"] }
# L3 显隐自检（overlay）直接驱动 winit 窗口栈。
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[lints]
workspace = true

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1

# 剖析专用：release 同级优化，保留符号表供火焰图 / vmmap 符号化
[profile.profiling]
inherits = "release"
strip = "debuginfo"
