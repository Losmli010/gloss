# 开发与门禁工具的版本单点清单：钉版本的条目全仓只此一处，环境初始化校验
# 与持续集成安装运行时同读本文件，升级只改这里。产生门禁判定的工具钉全版本，
# 保证本地与远端判定一致。本语言（Rust）工具链有原生钉版本文件作另一条权威
# 源，不进本清单。

# 门禁解释器的版本下限，跨版本的正则与词法行为有判定分叉风险
[python]
min = "3.12"

[ruff]
version = "0.17.2"

[tombi]
version = "1.5.5"

# 标记语言（Markdown）排版门禁工具，纯文本门禁组合每提交必跑，钉全版本保证本地与远端判定一致
[rumdl]
version = "0.3.0"

# 文档门禁的解析树底座（markdown-it-py），解析行为影响判定，钉全版本保证本地与远端判定一致
[markdown-it-py]
version = "4.2.0"

# 解析器插件（mdit-py-plugins）：表格、任务列表与数学记号，随上条同源钉版本
[mdit-py-plugins]
version = "0.6.1"

# 密钥门禁的匹配引擎，每提交必跑，钉全版本保证本地与远端判定一致
[ripgrep]
version = "14.1.1"

[just]
# 浮动缘由：命令入口只分发配方不参与任何门禁判定，且各安装渠道天然给最新版
floating = true

[pytest]
# 浮动缘由：测试运行器不承载门禁判定——断言在各检查器自身，浮动兼得缺陷修复
floating = true
