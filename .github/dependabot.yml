# 依赖机器人（Dependabot）配置
# 自动跟踪依赖更新，定期开拉取请求（PR），减少人工跟进成本。

version: 2

updates:
  # ---- 本语言（Rust）依赖（cargo）----
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    # 同一生态的多个更新聚合成一个拉取请求（PR），减少噪音
    groups:
      rust-dependencies:
        patterns:
          - "*"
    # 兼容性优先：只提能自动合入的安全与补丁级更新
    versioning-strategy: "auto"
    labels:
      - "dependencies"
      - "cargo"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10

  # ---- 托管平台（GitHub）的动作，工作流中引用的动作版本 ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
