# 性能数据流水线：手动触发（workflow_dispatch，取 main HEAD）→ 全量采集 → 推数据分支，人工开 PR 审查合入。
# 定位是趋势数据例行生产，不是门禁：不判任何 PR 的生死；合入 main 不自动触发。
name: Perf data

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# 唯一写用途：推送数据分支。
permissions:
  contents: write

# 数据分支基于触发时的 main HEAD、趋势点同 commit 原位覆盖：重复触发时取消
# 在跑的一次，由最新一次（取最新 main）重新采集，避免并行采集互踩数据分支。
concurrency:
  group: perf-data
  cancel-in-progress: true

jobs:
  collect:
    name: Collect perf data
    # 钉稳定标签不用浮动 macos-latest；镜像代际断点由趋势点 env 段显式记录。
    runs-on: macos-26
    steps:
      - name: Guard main-only dispatch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "数据采集固定取 main HEAD，请在 main 上触发本 workflow（当前：${GITHUB_REF_NAME}）。" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 数据分支在 main HEAD 之上追加提交，浅克隆推送有边界情况，取全量历史。
          fetch-depth: 0

      - name: Record main head
        id: head
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # rust-cache 会把 target/ 带回本 run：清掉基准与采集的本地产物，防上次
      # 运行的陈旧 estimates（已删除用例仍被合计）与旧 eval 报告混进本点。
      - name: Clean prior measurement artifacts
        run: rm -rf target/criterion target/perf target/eval

      # 采集顺序按设计文档 7.2 全量：clone 计数/密度（源码文本扫描，由
      # perf-collect 聚合时直接统计，无独立步骤）→ clone 分配 → 体积双架构
      # → criterion 墙钟 → selftest wrapper → app-metrics → 启动火焰图
      # → perf-collect 聚合 → perf-chart 重绘。托管 runner 独占硬件，无需负载先检。

      - name: Clone allocs benchmark
        run: just clone-bench

      - name: Binary size (both architectures)
        run: |
          cargo build --release --bin gloss
          cargo build --release --target x86_64-apple-darwin --bin gloss

      - name: Criterion wall clock
        run: just bench

      - name: Selftest wrapper (overlay & startup)
        run: just selftest-report

      # 不用 just app-metrics 配方：它在聚合后直接重绘图表，而 x86_64 体积
      # 要在聚合前补进片段（app-metrics.py 只填本机 ARM 架构的 binary_arm64_kb）。
      - name: App runtime metrics
        run: |
          cargo build --release
          ./scripts/perf/app-metrics.py

      - name: Fill x86_64 binary size
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          fragment = Path("target/perf/app-runtime.json")
          data = json.loads(fragment.read_text(encoding="utf-8"))
          data["binary_x64_kb"] = Path(
              "target/x86_64-apple-darwin/release/gloss"
          ).stat().st_size // 1024
          fragment.write_text(
              json.dumps(data, ensure_ascii=False, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(f"binary_x64_kb = {data['binary_x64_kb']}")
          PY

      # 火焰图走 dtrace 先行 + spawn 后采：flamegraph.py 的 pid-attach 模式要等
      # 探针就位才知道 pid，attach 的数秒延迟会错过启动突发（首跑实证：20s 窗口
      # 全落启动完成后的空闲段，零样本），故探针按 execname 过滤、先就位再 spawn；
      # launch 模式（flame-startup）要等进程退出，CI 上无人退它，同样不可用。
      # 折叠与渲染直接用 inferno；dtrace 在 runner VM 的 profile 提供器可用性
      # 未证，辅助视图失败不拖垮整条采集链。
      - name: Startup flamegraph (profiling build)
        continue-on-error: true
        run: |
          cargo install --locked inferno rustfilt
          cargo build --profile profiling --bin gloss
          out=target/perf/flamegraph-startup.dtrace.txt
          sudo dtrace -x ustackframes=100 -n '
            profile-997 /execname == "gloss" && arg1/ { @[ustack(100)] = count(); }
            tick-30s { exit(0); }' -o "$out" &
          dpid=$!
          ./target/profiling/gloss &
          app=$!
          sleep 32
          wait "$dpid" || true
          kill "$app" 2>/dev/null || true
          inferno-collapse-dtrace < "$out" | rustfilt \
            > target/perf/flamegraph-startup.folded.txt
          if [ ! -s target/perf/flamegraph-startup.folded.txt ]; then
            echo "dtrace 零样本：runner VM 的 profile 提供器可能不可用，跳过出图" >&2
            exit 1
          fi
          inferno-flamegraph --title "gloss startup 30s (macos-26 runner)" \
            target/perf/flamegraph-startup.folded.txt \
            > target/perf/flamegraph-startup.svg

      - name: Aggregate history point
        run: ./scripts/perf/perf-collect.py

      - name: Redraw trend charts
        run: ./scripts/perf/perf-chart.py

      # 数据 PR 只入库 history 与三张 SVG；其余测量数据（含火焰图 SVG）是
      # target/ 本地产物，留 artifact 供事后审计取证（口径同 ci.yml 自检信号的 90 天）。
      - name: Upload perf handoff
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-handoff-${{ github.run_id }}
          path: target/perf/
          if-no-files-found: ignore
          retention-days: 90

      - name: Push data branch
        env:
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          branch="perf/collect-${HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add scripts/perf/baselines/history.jsonl \
            scripts/perf/baselines/perf-latency.svg \
            scripts/perf/baselines/perf-resources.svg \
            scripts/perf/baselines/perf-hotpath.svg
          git commit -m "chore(perf): 采集 ${HEAD_SHA} 趋势点并重绘三张图"
          # 数据分支是可再生数据：同 commit 重跑时以本次结果覆盖旧分支。
          git push --force origin "$branch"

          prev=$(python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("scripts/perf/baselines/history.jsonl")
          points = [
              json.loads(line)
              for line in path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          print(points[-2]["commit"] if len(points) >= 2 else "")
          PY
          )
          {
            echo "数据分支 perf/collect-${HEAD_SHA} 已推送，请人工开 PR 审查合入。建议："
            echo
            echo '```'
            echo "gh pr create --base main --head perf/collect-${HEAD_SHA} \\"
            echo "  --title \"perf(data): 采集 ${HEAD_SHA} 趋势点\" --body-file pr-body.md"
            echo '```'
            echo
            echo "启动火焰图不入库：见本 run 的 artifact perf-handoff-${{ github.run_id }} 内 flamegraph-startup.svg。"
            echo
            echo "## perf-report 对比（本点 vs 上一点，启发式参考，非门禁）"
            echo
            if [ -n "$prev" ]; then
              ./scripts/perf/perf-report.py --from "$prev" --to "${HEAD_SHA}"
            else
              echo "首点无上一点可比，输出总览："
              echo
              ./scripts/perf/perf-report.py
            fi
          } >> "$GITHUB_STEP_SUMMARY"
