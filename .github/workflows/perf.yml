# 性能数据流水线：手动触发、取主分支最新提交、全量采集后推数据分支，人工开拉取请求（PR）审查合入。
# 定位是趋势数据例行生产，不是门禁：不判任何拉取请求的生死；合入主分支不自动触发。
name: Perf data

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# 唯一写用途：推送数据分支。
permissions:
  contents: write

# 数据分支基于触发时的主分支最新提交，趋势点按同一提交原位覆盖：重复触发时取消
# 在跑的一次，由最新一次（取最新主分支）重新采集，避免并行采集互踩数据分支。
concurrency:
  group: perf-data
  cancel-in-progress: true

jobs:
  collect:
    name: Collect perf data
    # 钉稳定镜像标签不用浮动最新版；镜像代际断点由趋势点的环境段显式记录。
    runs-on: macos-26
    steps:
      - name: Guard main-only dispatch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "数据采集固定取 main HEAD，请在 main 上触发本 workflow（当前：${GITHUB_REF_NAME}）。" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 数据分支在主分支最新提交之上追加提交，浅克隆推送有边界情况，取全量历史。
          fetch-depth: 0

      - name: Record main head
        id: head
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # 缓存动作会把构建产物目录带回本次运行：清掉基准与采集的本地产物，防上次
      # 运行的陈旧耗时明细（已删除用例仍被合计）与旧评测报告混进本点。
      - name: Clean prior measurement artifacts
        run: rm -rf target/criterion target/perf target/eval

      # 采集顺序全量：克隆计数与密度（源码文本扫描，聚合时直接统计，无独立步骤）、
      # 克隆分配、体积双架构、基准框架（criterion）墙钟、双自检、应用度量、启动火焰图，
      # 最后聚合与重绘。托管运行器独占硬件，无需负载先检。

      - name: Clone allocs benchmark
        run: just clone-bench

      - name: Binary size (both architectures)
        run: |
          cargo build --release --bin gloss
          cargo build --release --target x86_64-apple-darwin --bin gloss

      - name: Criterion wall clock
        run: just bench

      - name: Selftest wrapper (overlay & startup)
        run: just selftest-report

      # 不用应用度量配方：它在聚合后直接重绘图表，而另一架构的体积要在聚合前
      # 补进片段（度量脚本只填本机架构的体积字段）。
      - name: App runtime metrics
        run: |
          cargo build --release
          ./scripts/perf/app-metrics.py

      - name: Fill x86_64 binary size
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          fragment = Path("target/perf/app-runtime.json")
          data = json.loads(fragment.read_text(encoding="utf-8"))
          data["binary_x64_kb"] = Path(
              "target/x86_64-apple-darwin/release/gloss"
          ).stat().st_size // 1024
          fragment.write_text(
              json.dumps(data, ensure_ascii=False, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(f"binary_x64_kb = {data['binary_x64_kb']}")
          PY

      # 火焰图用停信号门闩加起始标记握手：拉起即停住进程，采样脚本起跟踪采样（dtrace）后
      # 轮询原始栈文件里的就绪标记（探针启用瞬间由起始标记写入）再放行——
      # 二三跑实证固定等待会输给虚拟机上采样（dtrace）的启用耗时（四十余样本对比理论
      # 上万），握手后一条指令都不会漏。门闩必须经外层壳包住：子壳里进程号指向
      # 父壳，停信号会打偏，本机冒烟实证。应用输出重定向到空设备且以终止信号补
      # 强杀信号：三跑实证存活的应用会拽住步骤管道把作业拖到六小时上限。由采样器
      # 直接产子进程不可用：应用以管理员跑，连不上窗口服务（WindowServer）；窗口十秒防空闲稀释。
      - name: Startup flamegraph (profiling build)
        continue-on-error: true
        run: |
          cargo install --locked inferno rustfilt
          cargo build --profile profiling --bin gloss
          out=target/perf/flamegraph-startup.svg
          bash -c 'kill -STOP $$; exec ./target/profiling/gloss' >/dev/null 2>&1 &
          app=$!
          ./scripts/perf/flamegraph.py --pid "$app" --duration 10 --out "$out" &
          fg=$!
          for i in $(seq 1 60); do
            grep -q armed "$out.dtrace.txt" 2>/dev/null && break
            sleep 1
          done
          kill -CONT "$app" 2>/dev/null || true
          wait "$fg" || true
          kill -TERM "$app" 2>/dev/null || true
          sleep 2
          kill -KILL "$app" 2>/dev/null || true
          test -s "$out"

      - name: Aggregate history point
        run: ./scripts/perf/perf-collect.py

      - name: Redraw trend charts
        run: ./scripts/perf/perf-chart.py

      # 数据拉取请求（PR）只入库历史数据与三张矢量图（SVG）；其余测量数据（含火焰图）是
      # 本地产物，留作产物供事后审计取证（保留期与主工作流自检信号一致，九十天）。
      - name: Upload perf handoff
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-handoff-${{ github.run_id }}
          path: target/perf/
          if-no-files-found: ignore
          retention-days: 90

      - name: Push data branch
        env:
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          branch="perf/collect-${HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add scripts/perf/baselines/history.jsonl \
            scripts/perf/baselines/perf-latency.svg \
            scripts/perf/baselines/perf-resources.svg \
            scripts/perf/baselines/perf-hotpath.svg
          git commit -m "chore(perf): 采集 ${HEAD_SHA} 趋势点并重绘三张图"
          # 数据分支是可再生数据：同一提交重跑时以本次结果覆盖旧分支。
          git push --force origin "$branch"

          prev=$(python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("scripts/perf/baselines/history.jsonl")
          points = [
              json.loads(line)
              for line in path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          print(points[-2]["commit"] if len(points) >= 2 else "")
          PY
          )
          {
            echo "数据分支 perf/collect-${HEAD_SHA} 已推送，请人工开 PR 审查合入。建议："
            echo
            echo '```'
            echo "gh pr create --base main --head perf/collect-${HEAD_SHA} \\"
            echo "  --title \"perf(data): 采集 ${HEAD_SHA} 趋势点\" --body-file pr-body.md"
            echo '```'
            echo
            echo "启动火焰图不入库：见本 run 的 artifact perf-handoff-${{ github.run_id }} 内 flamegraph-startup.svg。"
            echo
            echo "## perf-report 对比（本点 vs 上一点，启发式参考，非门禁）"
            echo
            if [ -n "$prev" ]; then
              ./scripts/perf/perf-report.py --from "$prev" --to "${HEAD_SHA}"
            else
              echo "首点无上一点可比，输出总览："
              echo
              ./scripts/perf/perf-report.py
            fi
          } >> "$GITHUB_STEP_SUMMARY"
