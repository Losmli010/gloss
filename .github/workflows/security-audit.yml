name: Security Audit

on:
  schedule:
    # 每日两次定时中的后一档（北京时间上午十点），主动发现新披露的漏洞。
    # PR 与推送时的安全门禁在主工作流的安全作业里。
    - cron: "0 2 * * *"
  workflow_dispatch:

# 最小权限：定时审计只需读代码。
permissions:
  contents: read

jobs:
  security:
    name: Daily security (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run cargo audit
        run: just audit

      - name: Run cargo deny
        run: just deny
