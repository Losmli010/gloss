name: Security Audit

on:
  schedule:
    # 每日 02:00 UTC（北京时间 10:00）跑一次，主动发现新披露的漏洞。
    # PR / push 时的安全门禁在 ci.yml 的 security job（依赖 quality）。
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  security:
    name: Daily security (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run cargo audit
        run: just audit

      - name: Run cargo deny
        run: just deny
