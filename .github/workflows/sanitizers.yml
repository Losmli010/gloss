name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# 最小权限：持续集成（CI）只需读代码。
permissions:
  contents: read

# 内存安全与未定义行为深检，只覆盖核心库（gloss-core）纯逻辑层。
jobs:
  miri:
    name: Miri (gloss-core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run Miri
        run: just miri

  valgrind:
    name: Valgrind (gloss-core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        # 工具链文件是唯一权威：按其钉住的频道与组件安装，工作流不再抄版本
        run: rustup toolchain install

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build tests
        run: cargo test -p gloss-core --lib --no-run

      - name: Run Valgrind
        run: |
          TEST_BIN=$(cargo test -p gloss-core --lib --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .executable != null and .profile.test == true) | .executable' \
            | head -n 1)
          echo "test binary: $TEST_BIN"
          valgrind --leak-check=full --show-leak-kinds=definite --errors-for-leak-kinds=definite --error-exitcode=1 "$TEST_BIN"
