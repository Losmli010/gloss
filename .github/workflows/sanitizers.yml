name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# 最小权限：CI 只需读代码。
permissions:
  contents: read

# 内存安全与未定义行为深检，只覆盖 gloss-core（纯逻辑层）：
# - Miri 解释执行 MIR、无法执行 FFI——平台层（macOS 框架调用）与渲染层（wgpu/egui）跑不了；
# - Valgrind 只有 Linux 版，而本仓库 macOS-only 后 Linux 上能编译的只有 gloss-core。
jobs:
  miri:
    name: Miri (gloss-core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Miri 只随 nightly 发布，上游只对最新 nightly 测试——跑挂了先跟着升 nightly
      - name: Install Rust nightly with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run Miri
        run: just miri

  valgrind:
    name: Valgrind (gloss-core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build tests
        run: cargo test -p gloss-core --lib --no-run

      - name: Run Valgrind
        run: |
          # 先编译再单独包测试二进制：直接包 cargo 会把 rustc 编译进程也拖进 valgrind
          TEST_BIN=$(cargo test -p gloss-core --lib --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .executable != null and .profile.test == true) | .executable' \
            | head -n 1)
          echo "test binary: $TEST_BIN"
          # memcheck 非法读写立即失败；泄漏先只报告不判死——Rust 测试的
          # still-reachable 常为有意持有，跑出基线后再决定是否收紧
          valgrind --leak-check=full --show-leak-kinds=definite --error-exitcode=1 "$TEST_BIN"
