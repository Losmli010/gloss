name: Release

on:
  push:
    tags:
      - "v*"

# 最小权限：顶层只读；仅 release job 创建 GitHub Release 需要写（见其 job 级 permissions）。
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    runs-on: ${{ matrix.os }}
    env:
      APP: target/${{ matrix.target }}/release/bundle/osx/Gloss.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version consistency
        id: version
        run: |
          # 与本地 just release-check 共用同一脚本（版本单点在根 Cargo.toml [workspace.package]）
          ./scripts/release/check-release-tag.sh "${GITHUB_REF_NAME}"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install cargo-bundle
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle

      - name: Bundle
        run: cargo bundle --release --target ${{ matrix.target }} --format osx

      - name: Ad-hoc sign
        run: |
          # 用 ad-hoc 签名替代正式的 Developer ID 签名（免费，无需证书）。
          # 用户首次打开需右键 → 打开，绕过 Gatekeeper。
          # 后续上 Developer ID 时，替换为 codesign --sign "Developer ID Application: ..." + notarytool。
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP" && echo "✓ ad-hoc 签名完成"

      - name: Smoke test
        # 冒烟只能跑与 runner 同架构的产物：macos-latest 是 arm64，x86_64 产物
        # 没有 Rosetta 就跑不起来，留给本机与 Intel runner 走查。
        if: matrix.target == 'aarch64-apple-darwin'
        run: ./scripts/release/smoke-app.sh "$APP"

      - name: Package artifacts
        run: |
          # .app 必须经 ditto 打包（保留签名与资源叉），上传目录散文件会让
          # Release 页变成一堆 Contents/... 碎片；.dmg 由系统 hdiutil 压制。
          # 产物名带版本与 target 三元组，Release 页上一眼可辨。
          STEM="gloss-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$STEM.zip"
          ./scripts/release/bundle-dmg.sh "$APP" "$STEM.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gloss-${{ matrix.target }}
          path: |
            gloss-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip
            gloss-${{ steps.version.outputs.version }}-${{ matrix.target }}.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # 唯一需要写权限的 job：发布产物到 GitHub Release。
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate CHANGELOG
        run: git cliff -o CHANGELOG.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: CHANGELOG.md
          generate_release_notes: false
