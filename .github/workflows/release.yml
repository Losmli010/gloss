name: Release

on:
  push:
    tags:
      - "v*"

# 最小权限：顶层只读；仅 release job 创建 GitHub Release 需要写（见其 job 级 permissions）。
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    runs-on: ${{ matrix.os }}
    env:
      APP: target/${{ matrix.target }}/release/bundle/osx/Gloss.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run release tag checker unit tests
        run: bash scripts/release/check-release-tag.test.sh

      - name: Run manifest generator unit tests
        run: bash scripts/release/gen-manifest.test.sh

      - name: Verify version consistency
        id: version
        run: |
          # 与本地 just release-check 共用同一脚本（版本单点在根 Cargo.toml [workspace.package]）
          ./scripts/release/check-release-tag.sh "${GITHUB_REF_NAME}"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install cargo-bundle
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle

      - name: Bundle
        run: cargo bundle --release --target ${{ matrix.target }} --format osx

      - name: Ad-hoc sign
        run: |
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP" && echo "✓ ad-hoc 签名完成"

      - name: Smoke test
        if: matrix.target == 'aarch64-apple-darwin'
        run: ./scripts/release/smoke-app.sh "$APP"

      - name: Package artifacts
        run: |
          # 产物名带版本与 target 三元组，Release 页上一眼可辨。
          STEM="gloss-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$STEM.zip"
          ./scripts/release/bundle-dmg.sh "$APP" "$STEM.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gloss-${{ matrix.target }}
          path: |
            gloss-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip
            gloss-${{ steps.version.outputs.version }}-${{ matrix.target }}.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # 唯一需要写权限的 job：发布产物到 GitHub Release。
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate CHANGELOG
        run: git cliff -o CHANGELOG.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: CHANGELOG.md
          generate_release_notes: false

  # 站点部署：release 成功后把 web/ + 本 tag 二进制 + manifest.json 发上 GitHub Pages。
  # Pages 部署失败不回滚 Release（Release 是历史事实源），job 显式失败可见，
  # 补救：重跑本 job（消费同 run artifacts）；artifact 超保留期则重跑整个 workflow。
  deploy-web:
    name: Deploy web to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    # Pages 部署需要的最小写权限（顶层仍为只读）。
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate manifest and stage binaries
        run: |
          # gen-manifest.sh 内部先跑 check-release-tag.sh（版本单点门禁，不一致即失败）
          ./scripts/release/gen-manifest.sh "${GITHUB_REF_NAME}" artifacts > web/manifest.json
          cp artifacts/gloss-*.zip artifacts/gloss-*.dmg web/latest/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
