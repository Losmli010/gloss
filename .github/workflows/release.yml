name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            format: osx
          - target: aarch64-apple-darwin
            os: macos-latest
            format: osx
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            format: deb

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          # 校验 tag 版本与版本号一致（version 单点维护在根 Cargo.toml [workspace.package]）
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          echo "tag version:  $TAG_VERSION"
          echo "cargo version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::版本号不一致：tag=$TAG_VERSION，Cargo.toml=$CARGO_VERSION"
            exit 1
          fi
          echo "✓ 版本号一致"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install cargo-bundle
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Bundle (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo bundle --release --target ${{ matrix.target }} --format osx

      - name: Ad-hoc sign (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # 用 ad-hoc 签名替代正式的 Developer ID 签名（免费，无需证书）。
          # 用户首次打开需右键 → 打开，绕过 Gatekeeper。
          # 后续上 Developer ID 时，替换为 codesign --sign "Developer ID Application: ..." + notarytool。
          APP="target/${{ matrix.target }}/release/bundle/osx/Gloss.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP" && echo "✓ ad-hoc 签名完成"

      - name: Bundle (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo bundle --release --target ${{ matrix.target }} --format deb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gloss-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate CHANGELOG
        run: git cliff -o CHANGELOG.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          body_path: CHANGELOG.md
          generate_release_notes: false
