name: Release

on:
  push:
    tags:
      - "v*"

# 最小权限：顶层只读；仅发布作业在托管平台（GitHub）创建发布页需要写，见其作业级权限。
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    runs-on: ${{ matrix.os }}
    env:
      APP: target/${{ matrix.target }}/release/bundle/osx/Gloss.app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run release tag checker unit tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest scripts/release/check_release_tag_test.py -q

      - name: Run manifest generator unit tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest scripts/release/gen_manifest_test.py -q

      - name: Verify version consistency
        id: version
        run: |
          # 与本地校验配方共用同一脚本（版本单点在根包清单的工作区段）
          ./scripts/release/check_release_tag.py "${GITHUB_REF_NAME}"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        # 工具链文件是唯一权威：按其钉住的频道与组件安装，工作流不再抄版本
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install cargo-bundle
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle

      - name: Bundle
        run: cargo bundle --release --target ${{ matrix.target }} --format osx

      - name: Ad-hoc sign
        run: |
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP" && echo "✓ ad-hoc 签名完成"

      - name: Smoke test
        if: matrix.target == 'aarch64-apple-darwin'
        run: ./scripts/release/smoke_app.py "$APP"

      - name: Package artifacts
        run: |
          # 产物名带版本与目标三元组，发布页上一眼可辨。
          STEM="gloss-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$STEM.zip"
          ./scripts/release/bundle_dmg.py "$APP" "$STEM.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gloss-${{ matrix.target }}
          path: |
            gloss-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip
            gloss-${{ steps.version.outputs.version }}-${{ matrix.target }}.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # 唯一需要写权限的作业：发布产物到托管平台（GitHub）发布页。
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: git cliff --latest -o release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body_path: release-notes.md
          generate_release_notes: false

  # 站点部署：发布成功后把站点资源、本标签的二进制与更新清单发上托管平台（GitHub）页面托管。
  # 页面托管部署失败不回滚发布，作业显式失败可见；补救是重跑本作业，消费同一次
  # 运行的产物；产物超保留期则重跑整个工作流。
  deploy-web:
    name: Deploy web to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    # 页面托管部署需要的最小写权限，顶层仍为只读。
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate manifest and stage binaries
        run: |
          # 清单生成脚本内部先跑版本一致性校验（版本单点门禁，不一致即失败）
          ./scripts/release/gen_manifest.py "${GITHUB_REF_NAME}" artifacts > web/manifest.json
          cp artifacts/gloss-*.zip artifacts/gloss-*.dmg web/latest/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
