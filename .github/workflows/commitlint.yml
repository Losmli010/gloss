name: Commitlint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test commit-msg checker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run checker unit tests
        run: bash scripts/check-commit-msg.test.sh

  commitlint:
    name: Commit message check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          # 校验本次 PR 引入的所有 commit message（跳过 merge commit）
          # PR 场景：比较 base 与 head 分支的实际提交
          # push 场景：比较 push 前后
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD_SHA="${{ github.event.after }}"
          fi
          git fetch origin "$BASE" "$HEAD_SHA" --depth=100 2>/dev/null || true
          # --no-merges 跳过 merge commit，避免 GitHub 自动生成的 "Merge ... into ..." 被误判
          git log --no-merges --format="%H" "$BASE..$HEAD_SHA" | while read sha; do
            msg="$(git log -1 --format=%B "$sha")"
            echo "检查 commit $sha"
            echo "$msg" | ./scripts/check-commit-msg.sh -
          done
