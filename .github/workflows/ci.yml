name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# 最小权限：CI 只需读代码。
permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check formatting
        run: just fmt

  lint:
    name: Lint (clippy)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run clippy
        run: just lint

  test:
    name: Test
    needs: [fmt, lint]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run tests
        run: just test
        env:
          GLOSS_PERF_OUT: ${{ runner.temp }}/perf/overlay.jsonl

      - name: Upload perf records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-overlay-${{ github.run_id }}
          path: ${{ runner.temp }}/perf/overlay.jsonl
          if-no-files-found: ignore
          retention-days: 90

  # 覆盖率：macOS 单平台统计（全部代码在该平台编译），摘要写 job summary，HTML 存档。
  coverage:
    name: Coverage (LLVM)
    needs: [fmt, lint]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run coverage
        # 行覆盖率阈值（70%，见 justfile 的 coverage_min）在配方最后一步判定，
        # 不达标时本步骤直接失败。
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          just coverage | tee "$RUNNER_TEMP/coverage-summary.txt"

      - name: Write job summary
        if: always()
        run: |
          {
            echo '## Coverage (LLVM)'
            echo '```'
            if [ -f "$RUNNER_TEMP/coverage-summary.txt" ]; then
              cat "$RUNNER_TEMP/coverage-summary.txt"
            else
              echo 'coverage run produced no summary (see step log)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: target/llvm-cov/html
          retention-days: 14
          if-no-files-found: error

  # 依赖安全与合规：已知漏洞（audit）+ 许可证 / 重复依赖 / 来源（deny，配置见 deny.toml）。
  # 每日定时还会再跑一次（security-audit.yml），主动发现新披露的漏洞。
  security:
    name: Security (audit + deny)
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run cargo audit
        run: just audit

      - name: Run cargo deny
        run: just deny

  # 发布目标平台构建冒烟：编译通过即算过，不跑测试。
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build
        run: just build-target ${{ matrix.target }}
