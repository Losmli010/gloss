name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# 最小权限：CI 只需读代码；artifact 上传在 v4 下同样只要 read token。
permissions:
  contents: read

jobs:
  # 快速静态门禁：格式 + 密钥扫描 + 文档引用 + 约束。全部是纯文本检查、
  # 不编译代码，放在 ubuntu runner 上跑得最快且最省。
  quality:
    name: Quality (fmt + secrets + docs + constraints)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check formatting
        run: just fmt

      # 扫描脚本自身的单元测试（纯 bash、秒级）：规则回归先于规则生效。
      - name: Run secrets checker unit tests
        run: bash scripts/check-secrets.test.sh

      # 与本地 precommit 共用同一脚本：硬编码密钥一旦进历史就得吊销轮换，挡在提交前。
      - name: Scan for hardcoded secrets
        run: just secrets

      # AGENTS.md 是唯一会被逐次加载进上下文的文档（客户端认的候选文件名只有它），
      # 描述的配方/路径一旦过期，代理就照着错的信息干活——所以文档引用也进门禁。
      - name: Run agents doc checker unit tests
        run: bash scripts/check-agents-doc.test.sh

      - name: Check AGENTS.md references
        run: just agents-doc

      # 「不可协商的约束」里可机械判定的部分（依赖方向 / 日志统一出口 / 日志英文 /
      # 版本单点 / 依赖特性）。先跑脚本自身单测：规则回归先于规则生效。
      - name: Run constraint checker unit tests
        run: bash scripts/check-constraints.test.sh

      - name: Check non-negotiable constraints
        run: just constraints

  # Clippy 需要编译整个 workspace：目标产物链接平台框架（ApplicationServices /
  # CoreGraphics 等），只能在 macOS 上构建，故单独占一个 macOS job。
  lint:
    name: Lint (clippy)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run clippy
        run: just lint

  # 测试在 macOS 跑：窗口服务、GPU 与辅助功能行为只有目标平台能覆盖。
  test:
    name: Test
    needs: [quality, lint]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run tests
        run: just test

  # 覆盖率：macOS 单平台统计（全部代码在该平台编译），摘要写 job summary，HTML 存档。
  coverage:
    name: Coverage (LLVM)
    needs: [quality, lint]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run coverage
        # 与本地共用 just coverage，避免 CI 与本地两套命令漂移。
        # 行覆盖率阈值（70%，见 justfile 的 coverage_min）在配方最后一步判定，
        # 不达标时本步骤直接失败。
        # 关掉 cargo 的着色，避免 ANSI 转义进 job summary。
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          just coverage | tee "$RUNNER_TEMP/coverage-summary.txt"

      - name: Write job summary
        if: always()
        run: |
          {
            echo '## Coverage (LLVM)'
            echo '```'
            if [ -f "$RUNNER_TEMP/coverage-summary.txt" ]; then
              cat "$RUNNER_TEMP/coverage-summary.txt"
            else
              echo 'coverage run produced no summary (see step log)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        # 阈值没过时也要拿到报告，否则无从判断是哪个文件把覆盖率拉了下来。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: target/llvm-cov/html
          retention-days: 14
          if-no-files-found: error

  # 依赖安全与合规：已知漏洞（audit）+ 许可证 / 重复依赖 / 来源（deny，配置见 deny.toml）。
  # 每日定时还会再跑一次（security-audit.yml），主动发现新披露的漏洞。
  security:
    name: Security (audit + deny)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run cargo audit
        run: just audit

      - name: Run cargo deny
        run: just deny

  # 发布目标平台构建冒烟：编译通过即算过，不跑测试。
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build
        run: just build-target ${{ matrix.target }}
