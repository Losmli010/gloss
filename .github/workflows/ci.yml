name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality gate (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run quality gate (just check)
        run: just check

  commitlint:
    name: Commit message check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          # 校验本次 push/PR 引入的所有 commit message
          # 对 PR：比较 base 与 head；对 push：比较 push 前一个 commit
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          git fetch origin "$BASE" --depth=1 2>/dev/null || true
          git log --format="%H" "$BASE..HEAD" | while read sha; do
            msg="$(git log -1 --format=%B "$sha")"
            echo "检查 commit $sha"
            echo "$msg" | ./scripts/check-commit-msg.sh -
          done
