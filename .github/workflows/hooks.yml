name: Hooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # edited：标题编辑后重跑，标题校验不漏掉合并前的改名
    types: [opened, synchronize, reopened, edited]

# 最小权限：只读代码与提交历史即可完成全部检查。
permissions:
  contents: read

jobs:
  # 硬编码密钥：规则单测先行，再扫全部 git 跟踪文件
  secrets:
    name: Secrets check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run checker unit tests
        run: bash scripts/hooks/check-secrets.test.sh

      - name: Scan for hardcoded secrets
        run: just secrets

  # AGENTS.md 引用一致性
  docs:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run checker unit tests
        run: bash scripts/hooks/check-agents-doc.test.sh

      - name: Check AGENTS.md references
        run: just agents-doc

  # 自动化门禁：可由工具判定的部分
  constraints:
    name: Constraints check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run checker unit tests
        run: bash scripts/hooks/check-constraints.test.sh

      - name: Check non-negotiable constraints
        run: just constraints

  # BDD 测试行为清单与测试源码双向一致
  test-bdd:
    name: Test BDD check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run checker unit tests
        run: bash scripts/hooks/check-test-bdd.test.sh

      - name: Check BDD inventory against test code
        run: just test-bdd

  # TOML 格式与 lint（tombi）：纯文本秒级；版本钉死保证判定一致
  toml:
    name: TOML check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install tombi
        run: npm install -g tombi@1.5.5

      - name: Check TOML formatting
        run: just fmt-toml

      - name: Lint TOML files
        run: just lint-toml

  commit-msg:
    name: Commit message check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run checker unit tests
        run: bash scripts/hooks/check-commit-msg.test.sh

      - name: Validate commit messages
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # 校验本次 PR 引入的所有 commit message（跳过 merge commit）
          # PR 场景：比较 base 与 head 分支的实际提交
          # push 场景：比较 push 前后
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD_SHA="${{ github.event.after }}"
          fi
          git fetch origin "$BASE" "$HEAD_SHA" --depth=100 2>/dev/null || true
          git log --no-merges --format="%H" "$BASE..$HEAD_SHA" | while read sha; do
            msg="$(git log -1 --format=%B "$sha")"
            echo "检查 commit $sha"
            echo "$msg" | ./scripts/hooks/check-commit-msg.sh -
          done
          # squash 合并产生的 commit message 取自 PR 标题，标题走同一套校验
          if [ -n "$PR_TITLE" ]; then
            echo "检查 PR 标题"
            printf '%s\n' "$PR_TITLE" | ./scripts/hooks/check-commit-msg.sh -
          fi
