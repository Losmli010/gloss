name: Hooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # 标题编辑后也重跑，标题校验不漏掉合并前的改名
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    # 评审结果提交与编辑后即核，正文模板门禁与评审模板门禁成对
    types: [submitted, edited]
  pull_request_review_comment:
    # 行内评论提交与编辑后即核，评论正文过书写规则
    types: [created, edited]

# 最小权限：只读代码与提交历史即可完成全部检查。
permissions:
  contents: read

jobs:
  # 纯文本门禁并轨作业：一次检出与装环境，检查器单测先跑，再按步骤依序跑各配方；
  # 步骤名与原独立作业同源，失败可按步骤名定位。本语言（Rust）格式化归主工作流
  # 的格式作业执行，不在此重复，迁移前后持续集成执行的门禁集合不变。
  text-gates:
    name: Text gates
    # 评审与评论事件只跑各自的正文检查，纯文本门禁不随评审重跑
    if: >-
      github.event_name != 'pull_request_review' &&
      github.event_name != 'pull_request_review_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # 版本钉死在仓库根版本清单，安装与本地校验同读
      - name: Resolve ripgrep version
        run: echo "RG_PIN=ripgrep@$(python3 scripts/dev/tool_version.py ripgrep)" >> "$GITHUB_ENV"

      - name: Install ripgrep
        uses: taiki-e/install-action@v2
        with:
          tool: ${{ env.RG_PIN }}

      - name: Install pytest, ruff, tombi, rumdl and markdown parsers
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pip install ruff==$(python3 scripts/dev/tool_version.py ruff)
          python3 -m pip install rumdl==$(python3 scripts/dev/tool_version.py rumdl)
          python3 -m pip install markdown-it-py==$(python3 scripts/dev/tool_version.py markdown-it-py)
          python3 -m pip install mdit-py-plugins==$(python3 scripts/dev/tool_version.py mdit-py-plugins)
          npm install -g tombi@$(python3 scripts/dev/tool_version.py tombi)

      # 检查器单测目录发现跑法与本地同款，覆盖全部门禁脚本与客户端钩子
      - name: Run checker unit tests
        run: just hooks-test

      # 硬编码密钥：扫全部仓库跟踪文件
      - name: Secrets check
        run: just secrets

      # 项目文档引用一致性
      - name: Docs check
        run: just agents-doc

      # 自动化门禁：可由工具判定的部分
      - name: Constraints check
        run: just constraints

      # 界面文案统一进文案表：文案字面量、装入点、词条表唯一
      - name: I18n check
        run: just i18n

      # 注释纪律：源码（Rust）只留中文文件头注释，注释主体全中文且无代码引用
      - name: Comments check
        run: just comments

      # 行为清单（BDD）与测试源码双向一致
      - name: Test BDD check
        run: just test-bdd

      # 评审结果模板：五段骨架在场，声明核对与正文模板必需小节同源
      - name: Review template check
        run: just review-template

      # 脚本语言（Python）格式化与静态检查（ruff）：纯文本秒级
      - name: Check Python formatting
        run: just fmt-py

      - name: Lint Python scripts
        run: just lint-py

      # 配置格式（TOML）与结构检查（tombi）：纯文本秒级
      - name: Check TOML formatting
        run: just fmt-toml

      - name: Lint TOML files
        run: just lint-toml

      # 标记语言（Markdown）格式化与排版检查（rumdl）：纯文本秒级
      - name: Check Markdown formatting
        run: just fmt-md

      - name: Lint Markdown files
        run: just lint-md

  commit-msg:
    name: Commit message check
    # 评审与评论事件不引入提交，提交信息校验不随评审重跑
    if: >-
      github.event_name != 'pull_request_review' &&
      github.event_name != 'pull_request_review_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run checker unit tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest scripts/hooks/check_commit_msg_test.py -q

      - name: Validate commit messages
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR_IS_BOT: ${{ endsWith(github.event.pull_request.user.login, '[bot]') }}
        run: |
          # 校验本次拉取请求（PR）引入的所有提交信息，跳过合并提交
          # 拉取请求场景：比较基线与目标分支的实际提交
          # 推送场景：比较推送前后
          # 机器人提交（依赖机器人）不按中文书写规则判罚，按作者名整段跳过
          # 全部消息落临时目录后一次进程吃进，免逐提交起解释器
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD_SHA="${{ github.event.after }}"
          fi
          git fetch origin "$BASE" "$HEAD_SHA" --depth=100 2>/dev/null || true
          msgdir="$RUNNER_TEMP/commit-msgs"
          rm -rf "$msgdir"
          mkdir -p "$msgdir"
          git log --no-merges --format="%H %an" "$BASE..$HEAD_SHA" | while read sha author; do
            case "$author" in *"[bot]") continue;; esac
            git log -1 --format=%B "$sha" > "$msgdir/$sha"
          done
          # 压缩合并产生的提交信息取自拉取请求（PR）标题，托管平台（GitHub）追加编号后缀，
          # 按最长常见占位编号模拟合并产物校验：标题自身合规而合并后超限同样拦下；
          # 模拟消息的拼装经校验脚本的合并模拟单点，落盘后与其余消息同一进程吃进
          if [ "$PR_AUTHOR_IS_BOT" != "true" ] && [ -n "$PR_TITLE" ]; then
            ./scripts/hooks/check_commit_msg.py --simulate-squash "$PR_TITLE" > "$msgdir/pr-title"
          fi
          shopt -s nullglob
          files=("$msgdir"/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "无提交信息需要校验"
            exit 0
          fi
          ./scripts/hooks/check_commit_msg.py "${files[@]}"

  # 拉取请求（PR）内容检查：标题与正文过书写规则，正文核对模板必需小节
  pr-template:
    name: PR content check
    # 推送与机器人（Dependabot）提交不套用模板，跳过
    if: github.event_name == 'pull_request' && !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 任务配方入口单测要实跑配方，先装任务运行器
      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run checker unit tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pip install markdown-it-py==$(python3 scripts/dev/tool_version.py markdown-it-py)
          python3 -m pip install mdit-py-plugins==$(python3 scripts/dev/tool_version.py mdit-py-plugins)
          python3 -m pytest scripts/hooks/check_pr_prose_test.py -q

      - name: Check PR title and body follow the prose rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 标题与正文取自接口：标题做合并模拟校验，正文过书写规则并核对模板必需小节
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .title > "$RUNNER_TEMP/pr_title"
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .body > "$RUNNER_TEMP/pr_body"
          python3 scripts/hooks/check_pr_prose.py "$RUNNER_TEMP/pr_body" "$RUNNER_TEMP/pr_title"

  # 第一版内容快照锁定：开启、同步与重开事件把当前标题加正文的摘要（SHA-256）
  # 以提交状态（commit status）幂等写上头提交，上下文名固定（Content snapshot），
  # 描述字段存摘要——同步重写必要，新推送换头提交后快照必须跟随，正文不随
  # 提交变化时重写哈希不变；编辑事件比对当前摘要与快照，不一致即判罚
  # （PR-SNAPSHOT），作业进必需清单作闸门。豁免解析与快照读写单点收口在快照
  # 脚本，本作业只传事件参数
  content-snapshot:
    name: Content snapshot check
    if: github.event_name == 'pull_request'
    # 最小权限：写快照只多要提交状态的写权限，其余照工作流默认只读
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 快照写入：编辑以外的事件（开启、同步、重开）都重写——重开兜住先推送
      # 换头提交后重开而快照缺席的空窗
      - name: Write content snapshot
        if: github.event.action != 'edited'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/hooks/check_pr_snapshot.py write
          ${{ github.event.pull_request.number }}
          ${{ github.event.pull_request.head.sha }}

      # 快照比对：机器人编辑按操作者（sender）排除，不按拉取请求（PR）作者；
      # 正文首行放行标记（snapshot:allow）加缘由在场时跳过判罚并以当前版重写基线
      - name: Compare content snapshot
        if: github.event.action == 'edited' && !endsWith(github.event.sender.login, '[bot]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/hooks/check_pr_snapshot.py compare
          ${{ github.event.pull_request.number }}
          ${{ github.event.pull_request.head.sha }}

  # 评审结果检查：评审人对拉取请求（PR）提交的评审结果过空正文、评审模板
  # 骨架、声明核对与书写规则判定；机器人评审没有评审结果产物，条件跳过；
  # 空正文不在条件层排除——条件只排除撤销与机器人，空正文判罚收在脚本单点
  review-result:
    name: Review result check
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.action != 'dismissed' &&
      !endsWith(github.event.review.user.login, '[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run checker unit tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pip install markdown-it-py==$(python3 scripts/dev/tool_version.py markdown-it-py)
          python3 -m pip install mdit-py-plugins==$(python3 scripts/dev/tool_version.py mdit-py-plugins)
          python3 -m pytest scripts/hooks/check_review_result_test.py -q

      - name: Check review result follows the review template
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 评审结果正文取自接口：正文空值折算为空串并入脚本的空正文判定，
          # 空正文、五段骨架、声明核对与书写规则都在脚本内单点判定
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews/${{ github.event.review.id }}" --jq '.body // ""' > "$RUNNER_TEMP/review_body"
          python3 scripts/hooks/check_review_result.py "$RUNNER_TEMP/review_body"

  # 行内评论检查：评审行内评论的正文过书写规则；单条评论没有模板骨架，不套
  # 小节与声明判定；机器人评论与空评论没有可判定产物，条件跳过，排除条件只
  # 放本工作流一处。作业定位红牌：不进必需检查清单，红灯靠人看到后修复，
  # 不拦合并
  review-comment:
    name: Review comment check
    if: >-
      github.event_name == 'pull_request_review_comment' &&
      !endsWith(github.event.comment.user.login, '[bot]') &&
      github.event.comment.body != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run checker unit tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pip install markdown-it-py==$(python3 scripts/dev/tool_version.py markdown-it-py)
          python3 -m pip install mdit-py-plugins==$(python3 scripts/dev/tool_version.py mdit-py-plugins)
          python3 -m pytest scripts/hooks/check_review_comment_test.py -q

      - name: Check review comment follows the prose rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 评论正文取自接口：空值折算为空串保取数形态良构，书写规则在脚本内单点判定
          gh api "repos/${{ github.repository }}/pulls/comments/${{ github.event.comment.id }}" --jq '.body // ""' > "$RUNNER_TEMP/comment_body"
          python3 scripts/hooks/check_review_comment.py "$RUNNER_TEMP/comment_body"
