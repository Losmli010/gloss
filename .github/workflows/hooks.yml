name: Hooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # 标题编辑后也重跑，标题校验不漏掉合并前的改名
    types: [opened, synchronize, reopened, edited]

# 最小权限：只读代码与提交历史即可完成全部检查。
permissions:
  contents: read

jobs:
  # 硬编码密钥：规则单测先行，再扫全部仓库跟踪文件
  secrets:
    name: Secrets check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run checker unit tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest scripts/hooks/check_secrets_test.py -q

      - name: Scan for hardcoded secrets
        run: just secrets

  # 项目文档引用一致性
  docs:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run checker unit tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest scripts/hooks/check_agents_doc_test.py -q

      - name: Check AGENTS.md references
        run: just agents-doc

  # 自动化门禁：可由工具判定的部分
  constraints:
    name: Constraints check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run checker unit tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest scripts/hooks/check_constraints_test.py -q

      - name: Check non-negotiable constraints
        run: just constraints

  # 界面文案统一进文案表：文案字面量、装入点、词条表唯一
  i18n:
    name: I18n check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run checker unit tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest scripts/hooks/check_i18n_test.py -q

      - name: Check UI copy lives in the catalog
        run: just i18n

  # 注释纪律：源码（Rust）只留中文文件头注释，注释主体全中文且无代码引用
  comments:
    name: Comments check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run checker unit tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest scripts/hooks/check_comments_test.py -q

      - name: Check comment discipline
        run: just comments

  # 行为清单（BDD）与测试源码双向一致
  test-bdd:
    name: Test BDD check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run checker unit tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest scripts/hooks/check_test_bdd_test.py -q

      - name: Check BDD inventory against test code
        run: just test-bdd

  # 脚本语言（Python）格式化与静态检查（ruff）：纯文本秒级；版本钉死保证判定一致
  python:
    name: Python format & lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install ruff
        run: python3 -m pip install ruff==0.17.2

      - name: Check Python formatting
        run: just fmt-py

      - name: Lint Python scripts
        run: just lint-py

  # 配置格式（TOML）格式与结构检查（tombi）：纯文本秒级；版本钉死保证判定一致
  toml:
    name: TOML check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install tombi
        run: npm install -g tombi@1.5.5

      - name: Check TOML formatting
        run: just fmt-toml

      - name: Lint TOML files
        run: just lint-toml

  commit-msg:
    name: Commit message check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run checker unit tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest scripts/hooks/check_commit_msg_test.py -q

      - name: Validate commit messages
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR_IS_BOT: ${{ endsWith(github.event.pull_request.user.login, '[bot]') }}
        run: |
          # 校验本次拉取请求（PR）引入的所有提交信息，跳过合并提交
          # 拉取请求场景：比较基线与目标分支的实际提交
          # 推送场景：比较推送前后
          # 机器人提交（依赖机器人）不按中文书写规则判罚，按作者名整段跳过
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD_SHA="${{ github.event.after }}"
          fi
          git fetch origin "$BASE" "$HEAD_SHA" --depth=100 2>/dev/null || true
          git log --no-merges --format="%H %an" "$BASE..$HEAD_SHA" | while read sha author; do
            case "$author" in *"[bot]") continue;; esac
            msg="$(git log -1 --format=%B "$sha")"
            echo "检查 commit $sha"
            echo "$msg" | ./scripts/hooks/check_commit_msg.py -
          done
          # 压缩合并（squash）产生的提交信息取自拉取请求（PR）标题，托管平台（GitHub）追加编号后缀，
          # 按最长常见占位编号模拟合并产物校验：标题自身合规而合并后超限同样拦下
          if [ "$PR_AUTHOR_IS_BOT" != "true" ] && [ -n "$PR_TITLE" ]; then
            echo "检查 PR 标题（含 squash 后缀模拟 (#99999)）"
            printf '%s\n' "$PR_TITLE (#99999)" | ./scripts/hooks/check_commit_msg.py -
          fi

  # 拉取请求（PR）内容检查：标题与正文过书写规则，正文核对模板必需小节
  pr-template:
    name: PR content check
    # 推送与机器人（Dependabot）提交不套用模板，跳过
    if: github.event_name == 'pull_request' && !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run checker unit tests
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest scripts/hooks/check_pr_prose_test.py -q

      - name: Check PR title and body follow the prose rules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 标题与正文取自接口：标题做合并模拟校验，正文过书写规则并核对模板必需小节
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .title > "$RUNNER_TEMP/pr_title"
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq .body > "$RUNNER_TEMP/pr_body"
          python3 scripts/hooks/check_pr_prose.py "$RUNNER_TEMP/pr_body" "$RUNNER_TEMP/pr_title"
