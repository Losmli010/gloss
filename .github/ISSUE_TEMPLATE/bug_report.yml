name: Bug 报告
description: Gloss 表现不符合预期时用它
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索现有 issue，避免重复。
        日志在 `~/.gloss/logs`（`just logs` 可跟随最新）；**贴日志前抹掉 API key**。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 现象与期望行为；截图/录屏更有助于定位。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 选中 …
        2. 按下 …
        3. 浮层 …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志摘录
      description: 出问题时间点前后的段落即可，整份文件可附件。
      render: text
  - type: input
    id: build
    attributes:
      label: 版本 / 构建来源
      placeholder: v0.1.0 dmg / main 分支 just run
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 系统环境
      placeholder: "macOS 15.5，Apple Silicon；辅助功能授权：已开/未开"
    validations:
      required: true
